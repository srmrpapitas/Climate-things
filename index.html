<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from './vendor/BufferGeometryUtils.js';
import { EffectComposer } from './vendor/postprocessing/EffectComposer.js';
import { RenderPass } from './vendor/postprocessing/RenderPass.js';
import { UnrealBloomPass } from './vendor/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from './vendor/postprocessing/ShaderPass.js';
import { OutputPass } from './vendor/postprocessing/OutputPass.js';
import { GLTFLoader } from './vendor/GLTFLoader.js';

// carga los fenómenos y escenarios listados en lista.js
for (const src of [...(window.LISTA?.fenomenos || []), ...(window.LISTA?.escenarios || [])])
  await new Promise(ok => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = () => { console.warn('No se pudo cargar', src); ok(); }; document.head.appendChild(sc); });
const params = new URLSearchParams(location.search);
const ESC = window.ESCENARIOS[params.get('e')] || window.ESCENARIOS.ola || Object.values(window.ESCENARIOS)[0];
const FEN = window.FENOMENOS[ESC.tipo || 'ola'];
const NF = ESC.fases.length;

// ---------- utilidades ----------
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261023);
const rr = (a, b) => a + R() * (b - a);
const pick = arr => arr[Math.floor(R() * arr.length)];
function hash(x, y) { const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return n - Math.floor(n); }
function vnoise(x, y) { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; }
function fbm(x, y) { let s = 0, a = .5, f = 1; for (let i = 0; i < 4; i++) { s += a * vnoise(x * f, y * f); f *= 2.1; a *= .5; } return s / .9375; }
const EN = window.LANG === 'en';
function fmt(n, dec) { // español: 1.280 · 0,3 / inglés: 1,280 · 0.3
  if (dec === undefined) dec = n < 10 ? 1 : 0;
  let s = n.toFixed(dec); let [i, d] = s.split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, EN ? ',' : '.');
  return d && +d !== 0 ? i + (EN ? '.' : ',') + d : i; }

// ---------- textos de energía (toneladas de TNT) ----------
function textoTNT(t) {
  if (window.COMUN) return '≈ ' + COMUN.textoTNT(t); // fenomenos/comun.js: de mg a billones de gigatones
  if (t < 1000) return `≈ ${fmt(t)} toneladas de TNT`;
  if (t < 1e6) return `≈ ${fmt(t / 1e3)} kilotones de TNT`;
  if (t < 1e9) return `≈ ${fmt(t / 1e6)} megatones de TNT`;
  return `≈ ${fmt(t / 1e9)} gigatones de TNT`; }
function textoCmp(t) {
  if (window.COMUN) return COMUN.comparaTNT(t);
  if (t >= 50e6) { const n = t / 50e6; return `${fmt(n)} ${n < 1.05 && n > .95 ? 'Tsar Bomba' : 'Tsar Bombas'}`; }
  const n = t / 15000; return `${fmt(n)} ${n < 1.05 && n > .95 ? 'bomba' : 'bombas'} de Hiroshima`; }

// ---------- render ----------
const stage = document.getElementById('stage');
// ?bajo=1: calidad baja (sin sombras ni posproceso) para equipos lentos
const BAJO = params.get('bajo') === '1';
// ?grabar=1: modo exportación. El tiempo solo avanza con __game.step (fotograma a fotograma), el audio va a un
// OfflineAudioContext que se renderiza al final, y las transiciones CSS y los retrasos siguen el tiempo del juego.
const GRABAR = params.get('grabar') === '1';
// en el móvil, modo ligero (menos resolución, sombras más pequeñas y sin posproceso) para que vaya fluido;
// ?hd=1 lo quita. Al grabar siempre se usa la calidad completa.
const LIGERO = !GRABAR && params.get('hd') !== '1' && (params.get('ligero') === '1' || /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent)));
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(GRABAR ? devicePixelRatio : Math.min(devicePixelRatio, BAJO ? 1 : LIGERO ? 1.4 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = !BAJO; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, 9 / 16, 0.5, 4e6);
scene.fog = new THREE.Fog(0x9fd3f0, 1000, 8000);
scene.background = new THREE.Color(0x9fd3f0);
function resize() {
  let w, h;
  if (params.has('full')) { w = innerWidth; h = innerHeight; }
  else { w = Math.min(innerWidth, innerHeight * 9 / 16); h = w * 16 / 9; }
  stage.style.width = w + 'px'; stage.style.height = h + 'px'; stage.style.fontSize = (w / 15) + 'px';
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (composer) { composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w, h); }
}

// posproceso: brillo (bloom) en lo muy luminoso y viñeta suave
const VIGNETTE = { uniforms: { tDiffuse: { value: null }, fuerza: { value: .32 } },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  // y gradación de color de cine: algo más de contraste y saturación, sombras frías y luces cálidas
  fragmentShader: `uniform sampler2D tDiffuse; uniform float fuerza; varying vec2 vUv;
    void main() { vec4 c = texture2D(tDiffuse, vUv); vec2 d = (vUv - .5) * vec2(1.0, 1.25);
      float l = dot(c.rgb, vec3(.2126, .7152, .0722));
      c.rgb = mix(vec3(l), c.rgb, 1.12);
      c.rgb = (c.rgb - .5) * 1.08 + .5;
      c.rgb += mix(vec3(-.012, -.004, .018), vec3(.022, .01, -.016), smoothstep(.15, .85, l));
      c.rgb *= 1.0 - fuerza * smoothstep(.25, .85, dot(d, d) * 2.2); gl_FragColor = vec4(max(c.rgb, 0.0), c.a); }` };
let composer = null, bloom = null;
if (!BAJO && !LIGERO) {
  composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(256, 256), .45, .55, 1.15); composer.addPass(bloom);
  composer.addPass(new OutputPass());
  composer.addPass(new ShaderPass(VIGNETTE)); // después del tono: la gradación trabaja ya en sRGB
}
addEventListener('resize', resize); resize();

const hemi = new THREE.HemisphereLight(0xe4f2ff, 0x6b5b44, 1.05); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d8, 2.9); sun.position.set(-0.6, 1, 0.45); scene.add(sun);
// sombras del sol: su cámara sigue a lo que mira la cámara y se apaga al subir mucho
const SUN_DIR = new THREE.Vector3(-0.6, 1, 0.45).normalize();
scene.add(sun.target);
if (!BAJO) { sun.castShadow = true; sun.shadow.mapSize.set(LIGERO ? 1536 : 4096, LIGERO ? 1536 : 4096); sun.shadow.bias = -.0004; }

// cielo: degradado del horizonte al cénit con el sol y su halo
const skyU = { cHor: { value: new THREE.Color(0x9fd3f0) }, cTop: { value: new THREE.Color(0x3d86c8) }, cSol: { value: new THREE.Color(0xfff2d6) }, dirSol: { value: SUN_DIR }, sol: { value: 1 } };
const skyMat = new THREE.ShaderMaterial({ uniforms: skyU, side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
  vertexShader: 'varying vec3 vW; void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
  fragmentShader: `uniform vec3 cHor, cTop, cSol, dirSol; uniform float sol; varying vec3 vW;
    void main() { vec3 d = normalize(vW - cameraPosition); float h = max(d.y, 0.0);
      vec3 c = mix(cHor, cTop, pow(h, .55)); c = mix(c, cHor * .8, (1.0 - smoothstep(-.25, 0.0, d.y)));
      float s = max(dot(d, dirSol), 0.0);
      c += cSol * sol * (pow(s, 8.0) * .35 + pow(s, 90.0) * .9 + smoothstep(.9994, .9998, s) * 9.0);
      gl_FragColor = vec4(c, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }` });
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), skyMat); skyDome.renderOrder = -10; skyDome.frustumCulled = false; scene.add(skyDome);
// reflejos: un mapa de entorno hecho con el propio cielo, que se rehace cuando cambia de color
const pmrem = new THREE.PMREMGenerator(renderer), envScene = new THREE.Scene();
envScene.add(new THREE.Mesh(new THREE.SphereGeometry(100, 32, 16), skyMat));
let envRT = null; const envCol = new THREE.Color(-1, -1, -1); let envT = 0;
function updateEnv(dt) { envT -= dt; if (envT > 0 || (Math.abs(envCol.r - skyU.cHor.value.r) + Math.abs(envCol.g - skyU.cHor.value.g) + Math.abs(envCol.b - skyU.cHor.value.b)) < .02) return;
  envT = .5; envCol.copy(skyU.cHor.value); const rt = pmrem.fromScene(envScene, 0, .1, 1000); for (const m of envMats) { if (!m.envMap) m.needsUpdate = true; m.envMap = rt.texture; } if (envRT) envRT.dispose(); envRT = rt; }
const envMats = []; // solo el agua refleja el cielo (en todo lo demás lo lava)

const matCache = {};
function mat(c, o = {}) { const k = c + JSON.stringify(o); return matCache[k] ||= new THREE.MeshStandardMaterial({ color: c, flatShading: true, roughness: .85, ...o }); }
const BOX = new THREE.BoxGeometry(1, 1, 1);

// ---------- terreno ----------
const GROUND = 3; // cota del suelo de la ciudad
const PEAKS = [[7000, 56000, 8849, 7500], [-14000, 50000, 5200, 6000], [22000, 60000, 6100, 7000], [-3000, 70000, 6800, 8000],
  [15000, 44000, 3800, 5000], [-25000, 62000, 4500, 7000], [35000, 52000, 4200, 6000], [0, 86000, 7300, 9000], [-38000, 76000, 5500, 9000],
  [-8000, 34000, 2600, 4500], [9000, 28000, 1900, 4000], [-20000, 24000, 1700, 5000]];
function shoreOff(x) { const a = Math.abs(x); if (a < 4500) return 0; const k = smooth(4500, 9000, a);
  return k * (Math.sin(x / 9000) * 2600 + Math.sin(x / 3700 + 1) * 1100 + 1500); }
function cityK(x, z) { const dx = Math.max(0, Math.abs(x) - 2600), dz = Math.max(0, z - 2700); return 1 - smooth(0, 2500, Math.hypot(dx, dz)); }
function terrainY(x, z) {
  const zz = z - shoreOff(x);
  if (zz < 0) return Math.max(-400, zz * 0.04) - 1;
  const hills = smooth(800, 14000, zz) * (120 + fbm(x / 7000, zz / 7000) * 1100) + smooth(0, 800, zz) * 8;
  let m = 0;
  for (const p of PEAKS) { const r = Math.hypot(x - p[0], z - p[1]) / p[3]; m = Math.max(m, p[2] * Math.exp(-Math.pow(r, 1.25))); }
  m *= .82 + .3 * fbm(x / 2500, z / 2500);
  const land = 2 + hills + m;
  return z >= 0 ? lerp(land, 2, cityK(x, z)) : land;
}
function groundAt(x, z) { return (Math.abs(x) < 2600 && z > 60 && z < 2700) ? GROUND : Math.max(0, terrainY(x, z)); }

(function buildTerrain() {
  const SEG = 650, X0 = -78000, X1 = 78000, Z0 = -19500, Z1 = 110500;
  const g = new THREE.PlaneGeometry(X1 - X0, Z1 - Z0, (X1 - X0) / SEG, (Z1 - Z0) / SEG);
  g.rotateX(-Math.PI / 2); g.translate(0, 0, (Z0 + Z1) / 2);
  const p = g.attributes.position;
