<!doctype html>
<html><head><meta charset="utf-8"><title>Teatro de títeres</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:1280px;height:720px}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script src="titeres.js"></script><script src="personajes.js"></script><script src="decorados.js"></script><script src="frente.js"></script>
<script>
// Reproductor: escena.html?e=NOMBRE carga escenas/NOMBRE.js (que define window.ESCENA) y la reproduce en bucle.
// Para grabar: fabrica/titeres/grabar.mjs (llama a window.dibuja(t) fotograma a fotograma).
const nombre = new URLSearchParams(location.search).get('e') || 'mitin';
const fondo = new Image(); fondo.src = '../../historias/espanistan/sombras/pergamino.png';
const TINTES = { rojo: 'rgb(214,52,38)', noche: 'rgb(150,160,205)', sepia: 'rgb(235,200,150)' };
// ráfaga de viento dibujada (a lo Samurai Jack, pero en teatro de sombras): cintas negras que se enroscan con cortes de papel,
// líneas de velocidad y hojas, todo a lo largo del frente que barre la pantalla
function viento(g, t, k, frente) {
  const A = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  for (let i = 0; i < 9; i++) {
    const y0 = 40 + i * 80 + 30 * A(i), largo = 520 + 420 * A(i + 9), grosor = 14 + 46 * A(i + 3), cabeza = frente + 140 * A(i + 5) - (y0 / 720) * 260;
    const ola = x => y0 + 38 * Math.sin((x - cabeza) / 90 + i) + 18 * Math.sin((x - cabeza) / 37 + k * 9);
    g.beginPath();
    for (let j = 0; j <= 24; j++) { const u = j / 24, x = cabeza - largo * u, w = grosor * Math.sin(Math.PI * Math.min(1, u * 1.4)) * (1 - u * .6); g.lineTo(x, ola(x) - w / 2); }
    for (let j = 24; j >= 0; j--) { const u = j / 24, x = cabeza - largo * u, w = grosor * Math.sin(Math.PI * Math.min(1, u * 1.4)) * (1 - u * .6); g.lineTo(x + (j % 3 === 0 ? 14 : 0), ola(x) + w / 2); }
    g.closePath(); g.fillStyle = '#0b0705'; g.fill();
    g.strokeStyle = 'rgba(242,214,160,.85)'; g.lineWidth = 2; g.beginPath();      // corte de papel dentro de la cinta
    for (let j = 2; j <= 18; j++) { const x = cabeza - largo * j / 24; j === 2 ? g.moveTo(x, ola(x)) : g.lineTo(x, ola(x)); } g.stroke();
    const rizo = cabeza + 10, ry = ola(cabeza);                          // la punta se enrosca
    g.lineWidth = Math.max(3, grosor * .18); g.lineCap = 'round'; g.strokeStyle = '#0b0705'; g.beginPath(); g.arc(rizo - grosor * .3, ry - grosor * .45, grosor * .45, Math.PI * .55, Math.PI * (1.45 + .25 * Math.sin(k * 6 + i))); g.stroke();
  }
  g.strokeStyle = 'rgba(11,7,5,.7)'; g.lineWidth = 3;                    // líneas de velocidad
  for (let i = 0; i < 26; i++) { const y = 720 * A(i + 40), x = frente + 300 * A(i + 60) - 200, l = 120 + 260 * A(i + 80); g.beginPath(); g.moveTo(x, y); g.lineTo(x - l, y + 8); g.stroke(); }
  g.fillStyle = '#0b0705';                                               // hojas arrastradas
  for (let i = 0; i < 18; i++) { g.save(); g.translate(frente + 220 * A(i + 100) - 60, 720 * A(i + 120) + 30 * Math.sin(t * 9 + i)); g.rotate(t * 11 + i); g.beginPath(); g.ellipse(0, 0, 9, 3.5, 0, 0, Math.PI * 2); g.fill(); g.restore(); }
}
// ---------- transiciones entre escenas (plano.transicion): k va de 0 a 1 en 0,9 s; `muestra(camino)` enseña el plano nuevo dentro del camino ----------
const AZ = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const copia = document.createElement('canvas');
let G0 = null;                                                     // el contexto del lienzo, para dibujar los caminos de las máscaras
const ola = (frente, amp, sesgo, k, aLaDerecha) => {                 // borde ondulado que barre la pantalla; enseña lo que queda detrás de él
  const x = y => frente - amp * Math.sin(y / 120 + k * 4) - (y / 720) * sesgo;
  G0.moveTo(aLaDerecha ? 1500 : -220, -50); for (let y = -50; y <= 770; y += 30) G0.lineTo(x(y), y); G0.lineTo(aLaDerecha ? 1500 : -220, 770); G0.closePath();
};
const TRANS = {
  // viento: cintas negras, líneas de velocidad y hojas, de izquierda a derecha
  viento(g, t, k, muestra) { G0 = g; const frente = -500 + 2400 * k; muestra(() => ola(frente, 160, 260, k, false)); viento(g, t, k, frente); },
  // pájaros: una bandada negra cruza de derecha a izquierda y deja detrás el plano nuevo
  pajaros(g, t, k, muestra) { G0 = g; const frente = 1780 - 2500 * k; muestra(() => ola(frente, 120, -200, k, true));
    for (let i = 0; i < 70; i++) {                                 // bandada de cuervos: más grandes y más juntos en el frente
      const d = AZ(i + 3), x = frente - 120 + (AZ(i) - .25) * 560 * (.4 + d) - AZ(i + 300) * 90 * k, y = 720 * AZ(i + 1) + 25 * Math.sin(t * 3 + i);
      T.cuervo(g, x, y, 10 + 46 * d * d, t * (11 + 5 * AZ(i + 7)) + i * 2.3, -1);
    }
    g.fillStyle = '#0b0705';
    for (let i = 0; i < 14; i++) { const u = (k * 1.6 + AZ(i + 50)) % 1, x = frente + 200 + 600 * AZ(i + 60) - 200 * u, y = 720 * AZ(i + 70) + 160 * u;   // plumas que caen
      g.save(); g.translate(x, y); g.rotate(Math.sin(t * 4 + i) * .8); g.beginPath(); g.ellipse(0, 0, 10, 3, 0, 0, 6.3); g.fill(); g.restore(); } },
  // papeletas: un remolino de sobres y papeletas de voto, de izquierda a derecha
  papeles(g, t, k, muestra) { G0 = g; const frente = -500 + 2400 * k; muestra(() => ola(frente, 110, 160, k, false));
    for (let i = 0; i < 80; i++) {
      const d = AZ(i + 9), x = frente - 380 * AZ(i) + 120, y = 720 * AZ(i + 2) + 40 * Math.sin(t * 5 + i), s = .6 + 1.2 * d;
      g.save(); g.translate(x, y); g.rotate(t * (3 + 4 * AZ(i + 5)) + i); g.scale(s, s * Math.cos(t * (6 + 5 * AZ(i + 4)) + i));
      g.fillStyle = AZ(i + 11) < .5 ? '#efe6d2' : '#d9cdb3'; g.fillRect(-14, -18, 28, 36); g.strokeStyle = '#3a2410'; g.lineWidth = 1.4; g.strokeRect(-14, -18, 28, 36);
      if (AZ(i + 13) < .5) { g.beginPath(); g.moveTo(-14, -18); g.lineTo(0, -4); g.lineTo(14, -18); g.stroke(); }    // sobre
      else { g.beginPath(); g.moveTo(-6, -8); g.lineTo(6, 4); g.moveTo(6, -8); g.lineTo(-6, 4); g.strokeStyle = '#8f1410'; g.lineWidth = 3; g.stroke(); }   // papeleta con su cruz
      g.restore(); } },
  // humo: bocanadas negras que tapan la imagen y, al disiparse, dejan el plano nuevo (para los vendehúmos y los que se van)
  humo(g, t, k, muestra) { G0 = g; if (k >= .5) muestra(() => G0.rect(-50, -50, 1400, 820));
    const den = Math.sin(Math.PI * k);
    for (let i = 0; i < 46; i++) { const x = 1280 * AZ(i), y = 760 - 900 * AZ(i + 1) * (.6 + .4 * k) - 140 * k, r = (90 + 230 * AZ(i + 2)) * (.5 + .9 * den);
      const gr = g.createRadialGradient(x, y, r * .2, x, y, r); gr.addColorStop(0, `rgba(18,12,9,${.95 * den})`); gr.addColorStop(1, 'rgba(18,12,9,0)');
      g.fillStyle = gr; g.fillRect(x - r, y - r, 2 * r, 2 * r); }
    g.fillStyle = `rgba(18,12,9,${Math.pow(den, 4)})`; g.fillRect(0, 0, 1280, 720); },
  // tinta: una mancha de tinta china que crece desde el centro, lo tapa todo y al retirarse deja el plano nuevo
  tinta(g, t, k, muestra) { G0 = g; if (k >= .5) muestra(() => G0.rect(-50, -50, 1400, 820));
    const r = 920 * Math.sin(Math.PI * Math.min(k, .999)), cx = 640 + 60 * Math.sin(k * 3), cy = 360;
    g.fillStyle = '#0b0705'; g.beginPath();
    for (let j = 0; j <= 48; j++) { const a = j / 48 * 6.283, rr = r * (1 + .16 * Math.sin(a * 5 + 1.3) + .1 * Math.sin(a * 11) + .08 * AZ(j)); j ? g.lineTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a)) : g.moveTo(cx + rr * Math.cos(a), cy + rr * Math.sin(a)); }
    g.fill();
    for (let i = 0; i < 30; i++) { const a = 6.283 * AZ(i + 20), d = r * (1.08 + .5 * AZ(i + 21)), q = (4 + 22 * AZ(i + 22)) * Math.sin(Math.PI * k);   // salpicaduras
      g.beginPath(); g.arc(cx + d * Math.cos(a), cy + d * Math.sin(a), q, 0, 6.283); g.fill(); } },
  // tajo: un corte blanco en diagonal y la imagen se parte en dos mitades que se separan (para las rupturas)
  tajo(g, t, k, muestra) { G0 = g;
    const p0 = [-100, 760], v = [1480, -800], L0 = [p0[0] - .35 * v[0], p0[1] - .35 * v[1]], L1 = [p0[0] + 1.35 * v[0], p0[1] + 1.35 * v[1]], n = [.475, .88];
    const linea = Math.min(1, k / .3), u = Math.max(0, (k - .35) / .65), d = 900 * u * u;
    if (u > 0) {
      if (copia.width !== g.canvas.width) { copia.width = g.canvas.width; copia.height = g.canvas.height; }
      copia.getContext('2d').drawImage(g.canvas, 0, 0); muestra(() => G0.rect(-50, -50, 1400, 820));
      for (const [lado, ex] of [[-1, -1000], [1, 1800]]) { g.save(); g.setTransform(1.5, 0, 0, 1.5, 0, 0); g.translate(lado * n[0] * d, lado * n[1] * d);
        g.beginPath(); g.moveTo(...L0); g.lineTo(...L1); g.lineTo(L1[0], ex); g.lineTo(L0[0], ex); g.closePath(); g.clip();
        g.setTransform(1, 0, 0, 1, lado * n[0] * d * 1.5, lado * n[1] * d * 1.5); g.drawImage(copia, 0, 0); g.restore(); }
      g.setTransform(1.5, 0, 0, 1.5, 0, 0);
    }
    const a = Math.max(0, 1 - u * 2.5); if (a > 0) { g.save(); g.strokeStyle = `rgba(255,248,236,${a})`; g.shadowColor = 'rgba(255,255,255,.9)'; g.shadowBlur = 18;
      g.lineWidth = 6 * (1 - u) + 2; g.beginPath(); g.moveTo(...p0); g.lineTo(p0[0] + v[0] * linea, p0[1] + v[1] * linea); g.stroke(); g.restore(); } },
};
// títulos grandes (ESCENA.titulos: {en, hasta, texto, sub}): letras doradas espaciadas que entran despacio
function titulos(g, t) {
  for (const c of ESCENA.titulos || []) { if (t < c.en || t > c.hasta) continue;
    const a = Math.min(1, (t - c.en) / .8, (c.hasta - t) / .6), e = 1.08 - .08 * Math.min(1, (t - c.en) / 2.5);
    g.save(); g.globalAlpha = a; g.translate(640, c.y ?? 300); g.scale(e, e); g.textAlign = 'center';
    g.shadowColor = 'rgba(255,170,80,.8)'; g.shadowBlur = 24; g.font = '700 86px Georgia, serif'; g.fillStyle = '#f2d38a';
    g.letterSpacing = '14px'; g.fillText(c.texto, 0, 0); g.shadowBlur = 0; g.letterSpacing = '6px';
    if (c.sub) { g.font = 'italic 26px Georgia, serif'; g.fillStyle = '#e9dcc0'; g.fillText(c.sub, 0, 46); } g.restore(); }
}
// subtítulos de las voces (ESCENA.voces: {en, dura, quien, texto, archivo}); el nombre del personaje en dorado
function subtitulos(g, t) {
  const v = (ESCENA.voces || []).find(v => !v.sinSub && t >= v.en && t < v.en + v.dura + .25); if (!v) return;   // el narrador va sin subtítulo (sinSub)
  const a = Math.min(1, (t - v.en) / .2, (v.en + v.dura + .25 - t) / .2);
  g.save(); g.globalAlpha = a; g.font = '600 30px Georgia, serif'; g.textAlign = 'center';
  const nombre = v.quien && v.quien !== 'narrador' ? v.quien.toUpperCase() + ':  ' : '', txt = nombre + v.texto;
  g.font = (nombre ? 'italic ' : '') + '600 30px Georgia, serif';
  let lineas = [txt];                                                   // si no cabe, en dos líneas partidas por el espacio más cercano al centro
  if (g.measureText(txt).width > 1120) { const esp = [...txt.matchAll(/ /g)].map(m => m.index), c = esp.reduce((a, b) => Math.abs(b - txt.length / 2) < Math.abs(a - txt.length / 2) ? b : a); lineas = [txt.slice(0, c), txt.slice(c + 1)]; }
  const w = Math.max(...lineas.map(l => g.measureText(l).width)), y0 = 684 - 42 * lineas.length;
  g.fillStyle = 'rgba(10,6,3,.62)'; g.fillRect(640 - w / 2 - 22, y0, w + 44, 42 * lineas.length + 6);
  g.fillStyle = v.quien && v.quien !== 'narrador' ? '#f2c14e' : '#f4ead2'; lineas.forEach((l, i) => g.fillText(l, 640, y0 + 32 + 42 * i)); g.restore();
}
// carteles con datos (ESCENA.carteles: {en, hasta, titulo, filas: [[texto, valor, color]], fuente}), en papel viejo
function carteles(g, t) {
  for (const c of ESCENA.carteles || []) {
    if (t < c.en || t > c.hasta) continue;
    const a = Math.min(1, (t - c.en) / .35, (c.hasta - t) / .3), x = c.x ?? 700, y = c.y ?? 90, w = c.ancho ?? 520, h = 92 + c.filas.length * 64;
    g.save(); g.globalAlpha = a; g.translate(x + w / 2, y + h / 2); g.rotate(-.012); g.scale(.92 + .08 * Math.min(1, (t - c.en) / .35), .92 + .08 * Math.min(1, (t - c.en) / .35)); g.translate(-w / 2, -h / 2);
    g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(8, 10, w, h); g.fillStyle = '#efe0bd'; g.fillRect(0, 0, w, h); g.strokeStyle = '#3a2410'; g.lineWidth = 3; g.strokeRect(8, 8, w - 16, h - 16);
    g.fillStyle = '#2a1708'; g.font = '700 26px Georgia, serif'; g.fillText(c.titulo, 28, 48);
    c.filas.forEach(([txt, val, col], i) => { const ti = c.tiempos ? c.tiempos[i] : c.en + .5 + i * (c.paso ?? .9); if (t < ti) return;   // c.tiempos: cada fila cuando la dice la voz
      const k = Math.min(1, (t - ti) / .3);
      g.globalAlpha = a * k; g.font = '500 22px Georgia, serif'; g.fillStyle = '#2a1708'; g.fillText(txt, 28, 96 + i * 64);
      const libre = w - 76 - g.measureText(txt).width; g.font = '700 34px Georgia, serif'; const tam = Math.max(18, Math.min(34, 34 * libre / Math.max(1, g.measureText(val).width)));   // el valor encoge si no cabe
      g.font = `700 ${tam.toFixed(1)}px Georgia, serif`; g.fillStyle = col || '#7a1d0c'; g.textAlign = 'right'; g.fillText(val, w - 28, 100 + i * 64); g.textAlign = 'left'; });
    g.globalAlpha = a; g.font = 'italic 16px Georgia, serif'; g.fillStyle = '#5b4126'; g.fillText('Fuente: ' + c.fuente, 28, h - 20); g.restore();
  }
}
window.listo = new Promise(r => {
  // primero los tiempos del audio del capítulo (escenas/tiempos.js; las escenas «04-…» usan tiempos-04.js) y luego la escena
  const tiempos = document.createElement('script'); tiempos.src = /^\d\d-/.test(nombre) ? `escenas/tiempos-${nombre.slice(0, 2)}.js` : 'escenas/tiempos.js'; tiempos.onload = tiempos.onerror = () => document.head.appendChild(s); document.head.appendChild(tiempos);
  const s = document.createElement('script'); s.src = `escenas/${nombre}.js`;
  s.onload = () => { const lienzo = document.getElementById('c');
    lienzo.width = 1920; lienzo.height = 1080;   // se dibuja directamente a 1080p
    // una escena puede tener varios planos con su propio decorado y reparto (contraplanos, vistas de frente o de espaldas)
    // cada plano se puede pintar en el lienzo o en uno auxiliar (para las transiciones de viento)
    const aux = document.createElement('canvas'); aux.width = lienzo.width; aux.height = lienzo.height;
    const planos = (ESCENA.planos || [ESCENA]).map(pl => { const d = Object.assign({ fps: ESCENA.fps, suelo: ESCENA.suelo }, pl);
      return { desde: pl.desde ?? 0, def: pl, pinta: T.escena(d, lienzo, fondo), pintaAux: T.escena(d, aux, fondo),
        paneles: (pl.paneles || []).map(p => Object.assign({}, p, { pinta: T.escena(Object.assign({}, d, p), aux, fondo) })) }; });
    const g = lienzo.getContext('2d');
    const tinte = (c, pl) => { if (!pl.def.tinte) return; const x = c.getContext('2d'); x.save(); x.setTransform(1, 0, 0, 1, 0, 0);
      x.globalCompositeOperation = 'multiply'; x.fillStyle = TINTES[pl.def.tinte] || pl.def.tinte; x.fillRect(0, 0, c.width, c.height); x.restore(); };
    window.dibuja = t => {
      t = Math.floor(t * (ESCENA.fps || 30) + 1e-6) / (ESCENA.fps || 30);
      let i = 0; planos.forEach((q, k) => { if (t >= q.desde) i = k; });
      const sig = planos[i + 1], viene = sig && TRANS[sig.def.transicion] && t >= sig.desde - .5;
      const actual = planos[i], fue = TRANS[actual.def.transicion] && t < actual.desde + .4 && i > 0;
      if (viene || fue) {                                              // transición: el plano siguiente aparece a través de la del tipo elegido
        const [a, b, t0] = viene ? [actual, sig, sig.desde] : [planos[i - 1], actual, actual.desde];
        a.pinta(t); tinte(lienzo, a); T.pintaColores(g, a.pinta.colores, t); b.pintaAux(t); tinte(aux, b); T.pintaColores(aux.getContext('2d'), b.pintaAux.colores, t);
        const k = Math.min(1, Math.max(0, (t - (t0 - .5)) / .9));
        TRANS[b.def.transicion](g, t, k, camino => { g.save(); g.setTransform(1.5, 0, 0, 1.5, 0, 0); g.beginPath(); camino(); g.clip(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(aux, 0, 0); g.restore(); g.setTransform(1.5, 0, 0, 1.5, 0, 0); });
      } else { actual.pinta(t); tinte(lienzo, actual); T.pintaColores(g, actual.pinta.colores, t); paneles(actual, t); }
      franjas(actual, planos[i - 1], t);
      g.setTransform(1.5, 0, 0, 1.5, 0, 0); carteles(g, t); titulos(g, t); subtitulos(g, t); };
    // pantalla partida a lo Samurai Jack (plano.paneles: [{ en, rect: [x, y, w, h], entra: 'izq'|'der'|'arriba'|'abajo', camara, decorado?, actores? }]):
    // cada panel es otro plano (hereda el decorado y el reparto) que entra deslizándose y se queda; entre ellos, rendijas negras
    const paneles = (pl, t) => { for (const p of pl.paneles) { if (t < p.en) continue;
      const k = T.suave((t - p.en) / .28), [x, y, w, h] = p.rect, lejos = { izq: [-(x + w), 0], der: [1280 - x, 0], arriba: [0, -(y + h)], abajo: [0, 720 - y] }[p.entra || 'izq'];
      const dx = lejos[0] * (1 - k), dy = lejos[1] * (1 - k);
      p.pinta(t); tinte(aux, { def: { tinte: p.tinte ?? pl.def.tinte } }); T.pintaColores(aux.getContext('2d'), p.pinta.colores, t);
      g.save(); g.setTransform(1.5, 0, 0, 1.5, 0, 0); g.fillStyle = '#0b0705'; g.fillRect(x + dx - 7, y + dy - 7, w + 14, h + 14);
      g.beginPath(); g.rect(x + dx, y + dy, w, h); g.clip(); g.setTransform(1, 0, 0, 1, 1.5 * (x + dx + w / 2 - 640), 1.5 * (y + dy + h / 2 - 360)); g.drawImage(aux, 0, 0); g.restore(); } };
    // franjas de cine (plano.franjas: true): bandas negras arriba y abajo; entran deslizándose si el plano anterior no las tenía
    const franjas = (pl, antes, t) => { if (!pl.def.franjas) return; const k = antes && antes.def.franjas ? 1 : T.suave((t - pl.desde) / .45), alto = 88 * k;
      g.save(); g.setTransform(1.5, 0, 0, 1.5, 0, 0); g.fillStyle = '#000'; g.fillRect(0, 0, 1280, alto); g.fillRect(0, 720 - alto, 1280, alto); g.restore(); };
    window.DURA = ESCENA.dura; window.FPS = ESCENA.fps || 30;
    const fin = () => { r(); let t0 = null; const vivo = ts => { if (t0 === null) t0 = ts; if (!window.grabando) window.dibuja(((ts - t0) / 1000) % ESCENA.dura); requestAnimationFrame(vivo); }; requestAnimationFrame(vivo); };
    fondo.complete ? fin() : (fondo.onload = fondo.onerror = fin); };
});
</script></body></html>
