<!doctype html>
<!-- Mira un GLB por encima: ver-glb.html?m=modelos/scd/trump.glb  (imprime caja y mallas en window.info) -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#222}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.min.js" } }</script>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../../vendor/GLTFLoader.js';
const q = new URLSearchParams(location.search), W = +q.get('w') || 540, H = +q.get('h') || 960;
const ren = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
ren.setSize(W, H); ren.outputColorSpace = THREE.SRGBColorSpace;
const esc = new THREE.Scene(); esc.background = new THREE.Color(0x333844);
esc.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2)); const s = new THREE.DirectionalLight(0xffffff, 2); s.position.set(3, 5, 4); esc.add(s);
const g = await new GLTFLoader().loadAsync('../../' + q.get('m')); esc.add(g.scene);
window.g = g; window.THREE = THREE;  // para inspeccionar desde fuera
const caja = new THREE.Box3().setFromObject(g.scene), tam = caja.getSize(new THREE.Vector3()), cen = caja.getCenter(new THREE.Vector3());
const cam = new THREE.PerspectiveCamera(40, W / H, .01, 5000), r = tam.length();
window.dibuja = (az = .6, el = .35, k = .9) => { cam.position.set(cen.x + Math.sin(az) * r * k, cen.y + r * el * k, cen.z + Math.cos(az) * r * k); cam.lookAt(cen); ren.render(esc, cam); };
const mallas = []; g.scene.traverse(o => o.isMesh && mallas.push(o.name));
window.info = { tam: tam.toArray().map(v => +v.toFixed(2)), min: caja.min.toArray().map(v => +v.toFixed(2)), mallas: mallas.length, nombres: mallas.slice(0, 200) };
window.dibuja(); window.listo = true;
</script>
