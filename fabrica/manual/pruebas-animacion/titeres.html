<!doctype html>
<html><head><meta charset="utf-8"><title>Prueba de títeres animados</title>
<style>html,body{margin:0;background:#000}canvas{display:block;width:1280px;height:720px}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script>
// Prueba: títeres de sombras dibujados en cada fotograma (como los pájaros), con esqueleto, articulaciones y
// movimiento secundario, en vez de recortes de la foto que solo giran. Se anima «a doses»: 12 dibujos por segundo.
const C = document.getElementById('c'), X = C.getContext('2d'), W = 1280, H = 720, SUELO = 612, FPS = 12;
const fondo = new Image(); fondo.src = '../../../historias/espanistan/sombras/pergamino.png';
const capa = document.createElement('canvas'); capa.width = W; capa.height = H; const K = capa.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), suave = x => x * x * (3 - 2 * x);
const rampa = (t, a, b) => suave(clamp((t - a) / (b - a)));
const ventana = (t, a, b, f = .35) => rampa(t, a, a + f) * (1 - rampa(t, b - f, b));
const azar = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const pt = (x, y, a, l) => [x + l * Math.sin(a), y + l * Math.cos(a)];   // ángulo 0 = hacia abajo, + = hacia delante

// miembro de papel: más grueso en la articulación de arriba, con remache en el codo/rodilla
function miembro(g, a, b, w0, w1) {
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]), nx = Math.sin(ang), ny = -Math.cos(ang);
  g.beginPath(); g.moveTo(a[0] + nx * w0, a[1] + ny * w0); g.lineTo(b[0] + nx * w1, b[1] + ny * w1);
  g.arc(b[0], b[1], w1, ang - Math.PI / 2, ang + Math.PI / 2); g.lineTo(a[0] - nx * w0, a[1] - ny * w0);
  g.arc(a[0], a[1], w0, ang + Math.PI / 2, ang + 3 * Math.PI / 2); g.fill();
}
const agujero = (g, x, y, r) => { g.save(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.restore(); };

// pierna: devuelve rodilla, tobillo y punta (con la cadera en 0,0)
function pierna(muslo, dobla, L1, L2) { const r = pt(0, 0, muslo, L1), tb = pt(r[0], r[1], muslo - dobla, L2); return [r, tb, [tb[0] + 24, tb[1] + 2]]; }

// un títere completo. o: {x, mira (1 derecha / -1 izquierda), paso (fase de la caminata), anda (0-1), brazoD/brazoF [hombro, codo],
//   inclina, cabeza, habla (0-1 boca), parpadea, tipo}
function titere(g, o, t) {
  g.save(); g.translate(o.x, SUELO); g.scale(1.3 * o.mira, 1.3); g.translate(0, -SUELO); g.fillStyle = '#0b0705'; g.strokeStyle = '#0b0705';
  const L1 = o.tipo === 'decano' ? 78 : 88, L2 = L1, f = o.paso, a = o.anda;
  const s = Math.sin(f), s2 = Math.sin(f + Math.PI);
  const p1 = pierna(.46 * s * a, (.12 + .85 * Math.max(0, Math.cos(f))) * a + .05, L1, L2);
  const p2 = pierna(.46 * s2 * a, (.12 + .85 * Math.max(0, Math.cos(f + Math.PI))) * a + .05, L1, L2);
  const caderaY = SUELO - Math.max(p1[1][1], p2[1][1]) - 6;                   // el pie que apoya toca el suelo
  g.translate(0, caderaY);
  const inc = o.inclina + .06 * a + .015 * Math.sin(t * 2.1);                 // respira
  const torso = 118, hom = pt(0, 0, Math.PI + inc, torso), cuello = pt(0, 0, Math.PI + inc, torso + 12);
  // pierna de atrás, brazo de atrás (un poco más claros: profundidad)
  g.globalAlpha = .93; dibPierna(g, p2, 16); dibBrazo(g, hom, o.brazoF, o, t, false); g.globalAlpha = 1;
  dibPierna(g, p1, 17);
  // abrigo / túnica: su faldón va con retraso respecto al cuerpo
  const faldon = -.25 * a * Math.cos(f * 2) - .1 * o.vel - .05 * Math.sin(t * 1.7), largo = o.tipo === 'decano' ? 150 : 82;
  const cin = pt(0, 0, Math.PI + inc, 8);
  g.beginPath(); g.moveTo(hom[0] - 34, hom[1] + 6);
  g.quadraticCurveTo(hom[0] + 40, hom[1] - 8, hom[0] + 32, hom[1] + 34);
  g.lineTo(cin[0] + 28, cin[1]);
  const fd = pt(cin[0] + 26, cin[1], faldon + .22, largo), ft = pt(cin[0] - 30, cin[1], faldon - .3, largo + 8);
  g.lineTo(fd[0], fd[1]);
  for (let i = 1; i < 7; i++) { const u = i / 7, x = fd[0] + (ft[0] - fd[0]) * u, y = fd[1] + (ft[1] - fd[1]) * u + (i % 2 ? 9 : 0); g.lineTo(x, y); }   // borde recortado
  g.lineTo(ft[0], ft[1]); g.lineTo(cin[0] - 32, cin[1] - 10); g.closePath(); g.fill();
  if (o.tipo === 'decano') { for (let i = 0; i < 4; i++) agujero(g, cin[0] - 2 + 6 * Math.sin(inc), cin[1] - 30 - i * 22, 3); }   // botones calados
  else { g.save(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.moveTo(hom[0] + 8, hom[1] + 4); g.lineTo(hom[0] + 18, hom[1] + 40); g.lineTo(hom[0] + 12, hom[1] + 42); g.closePath(); g.fill(); g.restore(); }  // solapa
  // cabeza
  g.save(); g.translate(cuello[0], cuello[1]); g.rotate(-(o.cabeza + inc * .5));
  if (o.tipo === 'decano') cabezaDecano(g, o, t); else cabezaJinete(g, o, t);
  g.restore();
  dibBrazo(g, hom, o.brazoD, o, t, true);
  agujero(g, p1[0][0], p1[0][1], 2.2);                                       // remaches de la rodilla
  g.restore();
}
function dibPierna(g, p, w) { miembro(g, [0, 0], p[0], w + 3, w - 1); miembro(g, p[0], p[1], w - 1, w - 5);
  g.beginPath(); g.moveTo(p[1][0] - 9, p[1][1] - 8); g.quadraticCurveTo(p[2][0] + 6, p[1][1] - 6, p[2][0] + 4, p[2][1] + 6); g.lineTo(p[1][0] - 12, p[2][1] + 6); g.closePath(); g.fill(); }
function dibBrazo(g, hom, [aH, aC], o, t, delante) {
  const co = pt(hom[0], hom[1], aH, 66), ma = pt(co[0], co[1], aH + aC, 60);
  miembro(g, hom, co, 15, 11); miembro(g, co, ma, 11, 8);
  g.beginPath(); g.arc(ma[0], ma[1], 11, 0, 7); g.fill();
  agujero(g, co[0], co[1], 2);
  if (o.tipo === 'decano' && !delante) {                                      // el candil cuelga de la mano de atrás y se balancea
    const pen = .5 * Math.sin(t * 2.6) * .25 - .6 * o.vel - (aH + aC) * .15, cu = pt(ma[0], ma[1], pen, 34);
    g.lineWidth = 2; g.beginPath(); g.moveTo(ma[0], ma[1]); g.lineTo(cu[0], cu[1]); g.stroke();
    g.save(); g.translate(cu[0], cu[1]); g.rotate(-pen);
    g.beginPath(); g.moveTo(-12, 0); g.lineTo(12, 0); g.lineTo(9, 30); g.lineTo(-9, 30); g.closePath(); g.fill();
    g.fillRect(-14, 30, 28, 5); g.restore();
    o.luz = [cu[0], cu[1] + 16, pen];
  }
  if (o.tipo === 'decano' && delante) {                                       // la lupa en la mano de delante
    const lu = pt(ma[0], ma[1], aH + aC + .2, 30); g.lineWidth = 5; g.beginPath(); g.moveTo(ma[0], ma[1]); g.lineTo(lu[0], lu[1]); g.stroke();
    const c2 = pt(lu[0], lu[1], aH + aC + .2, 16); g.beginPath(); g.arc(c2[0], c2[1], 17, 0, 7); g.fill(); agujero(g, c2[0], c2[1], 12);
  }
}
function cabezaJinete(g, o, t) {
  g.beginPath(); g.ellipse(4, -30, 25, 29, 0, 0, 7); g.fill();                   // cráneo
  g.beginPath(); g.moveTo(22, -40); g.lineTo(36, -24); g.lineTo(24, -20); g.fill();   // nariz
  for (let i = 0; i < 7; i++) { const a = -2.4 + i * .32, r = 27 + 3 * azar(i); g.beginPath(); g.moveTo(4 + 20 * Math.cos(a), -38 + 22 * Math.sin(a));
    g.lineTo(4 + (r + 7) * Math.cos(a + .1), -38 + (r + 4) * Math.sin(a + .1)); g.lineTo(4 + 20 * Math.cos(a + .25), -38 + 22 * Math.sin(a + .25)); g.fill(); }  // pelo corto
  const boca = .32 * o.habla;                                                  // la mandíbula con barba gira al hablar
  g.save(); g.translate(-6, -14); g.rotate(boca);
  g.beginPath(); g.moveTo(-8, -6); g.quadraticCurveTo(10, 4, 30, -4); g.lineTo(28, 6);
  for (let i = 0; i < 6; i++) g.lineTo(26 - i * 6, 18 + (i % 2) * 7);
  g.lineTo(-14, 6); g.closePath(); g.fill(); g.restore();
  if (boca > .03) { g.save(); g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.moveTo(10, -16); g.lineTo(32, -18); g.lineTo(32, -18 + 60 * boca); g.closePath(); g.fill(); g.restore(); }
  if (!o.parpadea) agujero(g, 17, -36, 3.2);
}
function cabezaDecano(g, o, t) {
  g.beginPath(); g.ellipse(2, -32, 24, 28, 0, 0, 7); g.fill();
  g.beginPath(); g.moveTo(20, -42); g.quadraticCurveTo(40, -30, 30, -22); g.lineTo(22, -20); g.fill();
  for (let i = 0; i < 11; i++) {                                               // pelo loco: cada mechón con su muelle
    const a = -2.9 + i * .26, mu = .22 * Math.sin(t * 3 + i * 1.3) + .3 * o.vel * Math.sin(t * 9 + i), l = 30 + 14 * azar(i + 9);
    const b = [2 + 20 * Math.cos(a), -40 + 22 * Math.sin(a)], q = [b[0] + l * Math.cos(a + mu), b[1] + l * Math.sin(a + mu)];
    g.beginPath(); g.moveTo(b[0] - 4, b[1]); g.quadraticCurveTo((b[0] + q[0]) / 2 + 8 * Math.sin(mu * 4), (b[1] + q[1]) / 2, q[0], q[1]); g.lineTo(b[0] + 5, b[1] + 2); g.fill();
  }
  const boca = .28 * o.habla;
  g.save(); g.translate(-2, -12); g.rotate(boca);
  g.beginPath(); g.moveTo(-10, -6); g.lineTo(26, -8); g.lineTo(22, 4); g.quadraticCurveTo(6, 12, -10, 4); g.closePath(); g.fill(); g.restore();
  g.lineWidth = 2.5; g.beginPath(); g.arc(18, -36, 9, 0, 7); g.stroke(); agujero(g, 18, -36, 6.5);   // gafas redondas caladas
  if (!o.parpadea) { g.beginPath(); g.arc(19, -36, 2.4, 0, 7); g.fill(); }
}

// la escena: 8 s. El jinete entra andando, se para y proclama; el Decano asiente, se acerca la lupa y le señala.
function pose(t) {
  const llega = 3.4, xj = -160 + 590 * rampa(t, .2, llega), andaJ = ventana(t, .1, llega + .2, .5);
  const j = { tipo: 'jinete', x: xj, mira: 1, paso: t * 7.4, anda: andaJ, vel: andaJ, inclina: 0, cabeza: 0,
    habla: 0, parpadea: (t % 3.1) < .13 };
  const puno = ventana(t, 4.0, 6.6, .5), habla = ventana(t, 4.2, 7.2, .2);
  j.brazoD = [-.35 * Math.sin(j.paso) * andaJ * (1 - puno) + puno * (2.75 + .12 * Math.sin(t * 6)), .35 * andaJ + puno * .25];
  j.brazoF = [.35 * Math.sin(j.paso) * andaJ - .1, .3 + .1 * andaJ];
  j.habla = habla * Math.max(0, Math.sin(t * 15) * .6 + Math.sin(t * 23 + 1) * .4);
  j.inclina = -.08 * puno + .04 * Math.sin(t * 1.3); j.cabeza = .1 * puno - .05 * habla * Math.sin(t * 4);
  const asiente = ventana(t, 4.6, 5.8), senala = ventana(t, 6.0, 8.0, .45), acerca = rampa(t, 5.6, 6.6);
  const d = { tipo: 'decano', x: 1060 - 110 * acerca, mira: -1, paso: t * 6 + 1, anda: ventana(t, 5.5, 6.7, .3) * .7, inclina: .05 * asiente, cabeza: 0,
    habla: 0, parpadea: ((t + 1.4) % 2.7) < .13 };
  d.vel = d.anda; d.cabeza = asiente * .16 * Math.sin(t * 7) - .05 * senala;
  d.brazoD = [.5 + .25 * Math.sin(t * 1.4) * (1 - senala) + senala * 1.15, .9 * (1 - senala) + .1];   // la lupa sube hasta señalar
  d.brazoF = [.25 + .05 * Math.sin(t * 1.7), .55];
  d.habla = ventana(t, 6.4, 7.8, .2) * Math.max(0, Math.sin(t * 13 + 2));
  return [j, d];
}

function dibuja(t) {
  t = Math.floor(t * FPS + 1e-6) / FPS;                                        // 12 dibujos por segundo, como la animación clásica
  const luz = .86 + .06 * Math.sin(t * 5.3) + .04 * Math.sin(t * 11.7 + 1);
  const z = 1 + .05 * rampa(t, 0, 8) + .03 * ventana(t, 4, 6.8, .8), cx = 640 + 60 * rampa(t, 3, 7), cy = 400;
  X.setTransform(1, 0, 0, 1, 0, 0); X.fillStyle = '#000'; X.fillRect(0, 0, W, H);
  X.setTransform(z, 0, 0, z, W / 2 - cx * z + (cx - 640) * .6, H / 2 - cy * z + 40);
  X.save(); X.translate(-(cx - 640) * .06, 0); X.filter = `brightness(${luz})`; if (fondo.complete) X.drawImage(fondo, -40, -40, W + 80, H + 80); X.filter = 'none'; X.restore();
  // decorado del fondo, en gris (capa lejana): colinas y un molino que gira despacio
  X.save(); X.translate(-(cx - 640) * .15, 0); X.fillStyle = 'rgba(60,35,18,.35)';
  X.beginPath(); X.moveTo(-100, 560); for (let x = -100; x <= 1400; x += 40) X.lineTo(x, 520 - 40 * Math.sin(x / 210) - 20 * Math.sin(x / 90)); X.lineTo(1400, 720); X.lineTo(-100, 720); X.fill();
  X.fillRect(1086, 380, 14, 140); X.save(); X.translate(1093, 380); X.rotate(t * .8); for (let i = 0; i < 4; i++) { X.rotate(Math.PI / 2); X.fillRect(-4, 0, 8, 70); } X.restore();
  X.restore();
  // pájaros (los de siempre)
  X.strokeStyle = '#140c06'; X.lineWidth = 2.5;
  for (let i = 0; i < 7; i++) { const vida = 8 + 4 * azar(i + 201), u = ((t + azar(i + 1) * vida) % vida) / vida, x = -40 + u * 1360, y = 70 + 160 * azar(i + 101) + 15 * Math.sin(t * 2 + i), al = 6 * Math.sin(t * 12 + i);
    X.beginPath(); X.moveTo(x - 11, y - al); X.lineTo(x, y); X.lineTo(x + 11, y - al); X.stroke(); }
  // suelo del escenario
  X.fillStyle = '#0b0705'; X.beginPath(); X.moveTo(-200, SUELO + 4); for (let x = -200; x <= 1500; x += 30) X.lineTo(x, SUELO + 4 + 3 * Math.sin(x * .07)); X.lineTo(1500, 760); X.lineTo(-200, 760); X.fill();
  for (let i = 0; i < 9; i++) { const x = 60 + i * 150 + 20 * azar(i), h = 18 + 14 * azar(i + 4), w = .2 * Math.sin(t * 1.8 + i);   // matas que se mecen
    for (let k = -2; k <= 2; k++) { X.beginPath(); X.moveTo(x + k * 5, SUELO + 6); X.quadraticCurveTo(x + k * 7 + w * 20, SUELO - h / 2, x + k * 10 + w * 40, SUELO - h + Math.abs(k) * 4); X.lineWidth = 2.5; X.strokeStyle = '#0b0705'; X.stroke(); } }
  // títeres en su propia capa (los agujeros dejan ver el pergamino)
  K.setTransform(1, 0, 0, 1, 0, 0); K.clearRect(0, 0, W, H);
  const [j, d] = pose(t); titere(K, j, t); titere(K, d, t);
  X.drawImage(capa, 0, 0);
  if (d.luz) { const lx = d.x - d.luz[0], ly = d.luz[1];                     // brillo del candil
    const gr = X.createRadialGradient(lx, ly, 2, lx, ly, 120); gr.addColorStop(0, `rgba(255,200,110,${.55 * luz})`); gr.addColorStop(1, 'rgba(255,170,80,0)');
    X.globalCompositeOperation = 'lighter'; X.fillStyle = gr; X.fillRect(lx - 130, ly - 130, 260, 260); X.globalCompositeOperation = 'source-over'; }
  // polvo en la luz
  for (let i = 0; i < 40; i++) { const r3 = azar(i + 201), y = ((azar(i + 101) * 720 - 12 * t * (.5 + r3)) % 720 + 720) % 720, x = azar(i + 1) * 1280 + 18 * Math.sin(t * (.3 + r3) + i);
    X.fillStyle = `rgba(255,225,160,${.12 + .2 * r3})`; X.beginPath(); X.arc(x, y, 1 + 1.6 * r3, 0, 7); X.fill(); }
  X.setTransform(1, 0, 0, 1, 0, 0);                                          // viñeta
  const v = X.createRadialGradient(640, 380, 300, 640, 380, 820); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.75)'); X.fillStyle = v; X.fillRect(0, 0, W, H);
}
window.dibuja = dibuja; window.DURA = 8; window.FPS = FPS;
window.listo = new Promise(r => { fondo.onload = r; fondo.onerror = r; });
let t0 = null; const vivo = ts => { if (t0 === null) t0 = ts; if (!window.grabando) dibuja(((ts - t0) / 1000) % 8); requestAnimationFrame(vivo); };
requestAnimationFrame(vivo);
</script></body></html>
