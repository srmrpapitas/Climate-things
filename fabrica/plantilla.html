      `</div><div class="anios">${[1982, 1996, 2004, 2011, 2018, 2026].map(a => `<span style="left:${(a - 1982) / .44}%">${a}</span>`).join('')}</div><div class="fuente">Fuente: La Moncloa</div>`, $('capas'));
