  :root { --papel: #f4efe6; --tinta: #222; --rojo: #c0392b; --ambar: #d68910; --gris: #6b6b6b; --verde: #1e8449; --azul: #1f4e8c; --oro: #f2c14e; --psoe: #d23b33; --pp: #2a6bc4; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #111; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #111; }
  .mundo { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; visibility: hidden; }
  .mundo > img, .mundo > svg, .mundo > .capa, .titere, .titere img { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; }
  .brillo { mix-blend-mode: screen; background: radial-gradient(circle at 968px 470px, rgba(255,170,60,.75) 0, rgba(255,140,40,.3) 160px, rgba(255,120,30,0) 520px); }
  .titere { transform-origin: 630px 700px; } .fCabeza { transform-origin: 630px 150px; } .fMano { transform-origin: 494px 308px; }
  #vineta { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 50%, rgba(0,0,0,.5) 100%); }
  .c { position: absolute; opacity: 0; }
  .tarjeta { background: var(--papel); border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.45); padding: 26px 34px 22px; }
  .dato { top: 170px; width: 620px; text-align: center; } .der { right: 110px; } .izq { left: 110px; } .centro { left: 650px; }
  .dato .v { font: 104px 'Archivo Black'; color: var(--azul); line-height: 1; } .dato .t { font: 600 36px Inter; color: var(--tinta); margin-top: 12px; }
  .fuente { font: italic 500 28px Lora; color: #777; margin-top: 10px; }
  .cita { left: 1000px; top: 140px; width: 800px; } .cita .a { font: 600 30px Inter; color: #8a6d3b; letter-spacing: 2px; } .cita .t { font: italic 500 50px/1.2 Lora; color: var(--tinta); margin-top: 12px; }
  .frasco { right: 110px; top: 190px; width: 760px; } .frasco h2 { font: 64px 'Archivo Black'; color: var(--tinta); } .frasco p { font: 600 34px/1.3 Inter; color: #444; margin-top: 10px; }
  .etq { display: inline-block; margin-top: 18px; padding: 8px 20px; border: 7px solid; border-radius: 12px; font: 40px 'Archivo Black'; transform: rotate(-4deg); }
  .estante { left: 90px; top: 70px; display: flex; gap: 14px; }
  .bote { width: 74px; height: 96px; border-radius: 14px 14px 20px 20px; background: rgba(210,235,240,.85); border: 4px solid #3a4a50; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font: 800 18px Inter; color: #fff; text-align: center; }
  .barras { left: 260px; top: 200px; width: 1400px; } .barras h3, .lista h3, .comp h3 { font: 800 44px Inter; color: var(--tinta); margin-bottom: 18px; }
  .fila { display: flex; align-items: center; gap: 22px; margin: 16px 0; font: 800 40px Inter; } .fila .n { width: 240px; } .fila .b { height: 66px; border-radius: 10px; transform-origin: 0 50%; }
  .lista { left: 300px; top: 210px; width: 1320px; } .item { font: 800 52px Inter; color: var(--tinta); margin: 18px 0; display: flex; gap: 26px; align-items: center; }
  .item i { font-style: normal; width: 70px; height: 70px; border: 7px solid var(--rojo); border-radius: 12px; color: var(--rojo); font: 52px 'Archivo Black'; display: flex; align-items: center; justify-content: center; flex: none; }
  .comp { left: 160px; top: 200px; width: 1600px; display: flex; gap: 40px; } .comp > div { flex: 1; } .comp p { font: 600 40px/1.3 Inter; color: #333; }
  .linea { left: 150px; top: 560px; width: 1620px; } .linea h3 { font: 800 34px Inter; }
  .barrasG { position: relative; height: 70px; margin-top: 16px; border-radius: 10px; overflow: hidden; background: #ddd5c6; }
  .tramo { position: absolute; top: 0; bottom: 0; transform-origin: 0 50%; color: #fff; font: 800 28px Inter; display: flex; align-items: center; justify-content: center; }
  .anios { position: relative; height: 38px; font: 600 28px Inter; color: #555; } .anios span { position: absolute; transform: translateX(-50%); top: 6px; }
  .sello { left: 0; right: 0; top: 330px; text-align: center; } .sello span { display: inline-block; padding: 14px 40px; border: 10px solid var(--rojo); border-radius: 18px; font: 96px 'Archivo Black'; color: var(--rojo); background: rgba(244,239,230,.9); transform: rotate(-6deg); }
  .titulo { inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 50%, rgba(10,10,10,.55) 0%, rgba(10,10,10,.88) 70%); }
  .titulo h1 { font: 170px 'Archivo Black'; color: var(--oro); letter-spacing: 6px; -webkit-text-stroke: 4px #3a2a10; paint-order: stroke fill; }
  .titulo h2 { font: 800 54px Inter; color: #fff; margin-top: 6px; } .titulo p { font: italic 500 36px Lora; color: #e9e1d2; margin-top: 34px; }
  .susc { left: 0; right: 0; top: 330px; display: flex; justify-content: center; align-items: center; gap: 46px; }
  .susc .like { width: 150px; height: 150px; border-radius: 50%; background: #f4efe6; display: flex; align-items: center; justify-content: center; font-size: 84px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .susc .btn { padding: 34px 60px; border-radius: 22px; background: #cc0000; color: #fff; font: 800 64px Inter; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  .susc .bell { width: 150px; height: 150px; border-radius: 50%; background: #f4efe6; display: flex; align-items: center; justify-content: center; font-size: 84px; box-shadow: 0 10px 30px rgba(0,0,0,.45); transform-origin: 50% 20%; }
  .cursor { position: absolute; width: 0; height: 0; border-left: 26px solid transparent; border-right: 26px solid transparent; border-bottom: 64px solid #fff; transform-origin: 50% 0; filter: drop-shadow(0 4px 6px rgba(0,0,0,.6)); }
  #sub { position: absolute; left: 200px; right: 200px; bottom: 70px; text-align: center; font: 800 56px Inter; color: #fff; -webkit-text-stroke: 10px rgba(0,0,0,.78); paint-order: stroke fill; line-height: 1.2; }
  #sub b { color: var(--oro); font-weight: 800; }
  #sub.f { color: #f6d58e; font-style: italic; }
  .pieza { position: absolute; } .pieza > img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .candil { mix-blend-mode: screen; background: radial-gradient(ellipse at 45% 42%, rgba(255,190,90,.32), rgba(255,170,60,0) 62%); }
  .cara { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 640px 360px; filter: url(#hervir) contrast(1.06) sepia(.12); }
  .cara img { position: absolute; left: 0; top: 60px; width: 1280px; }
  .banda { position: absolute; left: 0; width: 1280px; height: 55px; background: #000; }
  .nota { top: 150px; width: 560px; padding: 30px 34px 26px; background: #efe1c0; border: 3px solid #5a3d1e; border-radius: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.55); transform-origin: 50% 0; }

<script type="text/hf-after-fonts">const D = {"TOTAL": 564.12, "FRASES": [{"ini": 0.35, "fin": 2.67, "txt": "En el episodio anterior salimos de la cueva", "q": null}, {"ini": 2.47, "fin": 4.45, "txt": "para mirar al que gobierna.", "q": null}, {"ini": 4.25, "fin": 6.24, "txt": "Hoy miramos al que quiere gobernar.", "q": null}, {"ini": 7.04, "fin": 10.7, "txt": "El filósofo George <b>Santayana</b> escribió que quien no", "q": null}, {"ini": 10.5, "fin": 13.9, "txt": "recuerda su pasado está <b>condenado a repetirlo</b>.", "q": null}, {"ini": 13.7, "fin": 15.74, "txt": "Por eso hoy no miramos solo a un", "q": null}, {"ini": 15.54, "fin": 16.92, "txt": "hombre.", "q": null}, {"ini": 16.72, "fin": 18.35, "txt": "Miramos a <b>todo un partido</b>.", "q": null}, {"ini": 19.15, "fin": 22.67, "txt": "Este es <b>Feijolo</b>, el líder de la oposición.", "q": null}, {"ini": 22.47, "fin": 23.99, "txt": "Y este es su partido,", "q": null}, {"ini": 23.79, "fin": 25.77, "txt": "<b>el PP</b>, uno de los dos que se", "q": null}, {"ini": 25.57, "fin": 28.01, "txt": "han <b>turnado el poder</b> en Españistán desde hace", "q": null}, {"ini": 27.81, "fin": 29.14, "txt": "más de cuarenta años.", "q": null}, {"ini": 29.44, "fin": 31.34, "txt": "¡Españistaníes!", "q": "feijolo"}, {"ini": 31.14, "fin": 33.82, "txt": "Lo mío es gestión.", "q": "feijolo"}, {"ini": 33.62, "fin": 36.78, "txt": "Gestión, gestión…", "q": "feijolo"}, {"ini": 36.58, "fin": 38.18, "txt": "y más gestión.", "q": "feijolo"}, {"ini": 38.48, "fin": 40.76, "txt": "Mismas reglas que con Sanchís:", "q": null}, {"ini": 40.56, "fin": 43.92, "txt": "<b>datos públicos</b>, la <b>palabra exacta</b> de cada sentencia,", "q": null}, {"ini": 43.72, "fin": 45.61, "txt": "y <b>lo bueno</b> también se cuenta.", "q": null}, {"ini": 46.41, "fin": 49.49, "txt": "<b>Feijolo</b> presidió <b>Galicia</b> trece años,", "q": null}, {"ini": 49.29, "fin": 52.21, "txt": "de dos mil nueve a dos mil veintidós,", "q": null}, {"ini": 52.01, "fin": 55.11, "txt": "con <b>cuatro mayorías absolutas</b> seguidas.", "q": null}, {"ini": 54.91, "fin": 57.41, "txt": "En dos mil veintidós pasó a dirigir el", "q": null}, {"ini": 57.21, "fin": 58.27, "txt": "PP.", "q": null}, {"ini": 58.07, "fin": 60.55, "txt": "Y en las elecciones de dos mil veintitrés", "q": null}, {"ini": 60.35, "fin": 61.71, "txt": "fue el más votado:", "q": null}, {"ini": 61.51, "fin": 64.53, "txt": "ciento treinta y siete escaños.", "q": null}, {"ini": 64.33, "fin": 66.01, "txt": "Pero no gobernó.", "q": null}, {"ini": 65.81, "fin": 69.07, "txt": "En su investidura sacó ciento setenta y dos", "q": null}, {"ini": 68.87, "fin": 71.21, "txt": "votos, y necesitaba ciento setenta y seis.", "q": null}, {"ini": 71.01, "fin": 73.93, "txt": "Primera lección del Decano:", "q": null}, {"ini": 73.73, "fin": 76.27, "txt": "en una democracia parlamentaria,", "q": null}, {"ini": 76.07, "fin": 78.35, "txt": "<b>ganar no es gobernar</b>.", "q": null}, {"ini": 78.15, "fin": 80.11, "txt": "<b>Gobierna quien suma</b>.", "q": null}, {"ini": 79.91, "fin": 82.01, "txt": "¿Con quién suma cada uno?", "q": null}, {"ini": 81.81, "fin": 84.28, "txt": "Conviene preguntárselo antes de votar.", "q": null}, {"ini": 84.58, "fin": 86.68, "txt": "Yo gané las elecciones.", "q": "feijolo"}, {"ini": 86.48, "fin": 88.62, "txt": "Que los demás sumaran más…", "q": "feijolo"}, {"ini": 88.42, "fin": 90.71, "txt": "eso es un detalle técnico.", "q": "feijolo"}, {"ini": 91.01, "fin": 93.47, "txt": "El último gobierno del PP fue el de", "q": null}, {"ini": 93.27, "fin": 96.86, "txt": "Mariano Rajoy, de dos mil once a dos", "q": null}, {"ini": 96.66, "fin": 98.07, "txt": "mil dieciocho.", "q": null}, {"ini": 97.87, "fin": 100.57, "txt": "Llegó con el país en <b>plena crisis</b>.", "q": null}, {"ini": 100.37, "fin": 102.67, "txt": "El paro llegó a su máximo a principios", "q": null}, {"ini": 102.47, "fin": 104.15, "txt": "de dos mil trece:", "q": null}, {"ini": 103.95, "fin": 106.75, "txt": "el <b>veintiséis coma nueve</b> por ciento.", "q": null}, {"ini": 106.55, "fin": 108.91, "txt": "Más de uno de cada cuatro.", "q": null}, {"ini": 108.71, "fin": 110.83, "txt": "Cuando Rajoy se fue,", "q": null}, {"ini": 110.63, "fin": 113.17, "txt": "estaba en el <b>dieciséis coma siete</b>.", "q": null}, {"ini": 112.97, "fin": 115.41, "txt": "España salió de la recesión y evitó un", "q": null}, {"ini": 115.21, "fin": 117.25, "txt": "rescate completo del país,", "q": null}, {"ini": 117.05, "fin": 118.87, "txt": "como los de Grecia o Portugal.", "q": null}, {"ini": 119.67, "fin": 122.43, "txt": "Ahora, la <b>letra pequeña</b>.", "q": null}, {"ini": 122.23, "fin": 124.01, "txt": "Para salvar a los bancos,", "q": null}, {"ini": 123.81, "fin": 126.39, "txt": "el Estado puso unos <b>sesenta mil millones</b> de", "q": null}, {"ini": 126.19, "fin": 127.73, "txt": "euros.", "q": null}, {"ini": 127.53, "fin": 129.75, "txt": "Y el Banco de España calcula que la", "q": null}, {"ini": 129.55, "fin": 132.53, "txt": "mayor parte no se va a recuperar.", "q": null}, {"ini": 132.33, "fin": 136.77, "txt": "La deuda pública pasó de alrededor del sesenta", "q": null}, {"ini": 136.57, "fin": 140.49, "txt": "y nueve por ciento del PIB a cerca", "q": null}, {"ini": 140.29, "fin": 140.64, "txt": "del <b>noventa y ocho</b>.", "q": null}, {"ini": 140.44, "fin": 142.93, "txt": "Pregunta del Decano, la misma que con Sanchís:", "q": null}, {"ini": 142.73, "fin": 145.15, "txt": "si el paro baja pero la mochila pesa", "q": null}, {"ini": 144.95, "fin": 147.66, "txt": "cada vez más, ¿<b>quién la va a cargar</b>?", "q": null}, {"ini": 148.46, "fin": 150.82, "txt": "En la campaña de dos mil once,", "q": null}, {"ini": 150.62, "fin": 153.26, "txt": "Rajoy prometió <b>no subir los impuestos</b>.", "q": null}, {"ini": 153.06, "fin": 154.54, "txt": "Un mes después de llegar,", "q": null}, {"ini": 154.34, "fin": 157.28, "txt": "<b>subió el IRPF</b> y el IBI.", "q": null}, {"ini": 157.08, "fin": 158.96, "txt": "Y en dos mil doce subió el IVA", "q": null}, {"ini": 158.76, "fin": 162.02, "txt": "del dieciocho al veintiuno por ciento.", "q": null}, {"ini": 161.82, "fin": 164.6, "txt": "Él dijo que no había otra alternativa.", "q": null}, {"ini": 164.4, "fin": 167.1, "txt": "En dos mil doce aprobó también una amnistía", "q": null}, {"ini": 166.9, "fin": 168.34, "txt": "fiscal:", "q": null}, {"ini": 168.14, "fin": 171.84, "txt": "quien tenía dinero escondido podía regularizarlo pagando muy", "q": null}, {"ini": 171.64, "fin": 172.52, "txt": "poco.", "q": null}, {"ini": 172.32, "fin": 174.48, "txt": "En dos mil diecisiete,", "q": null}, {"ini": 174.28, "fin": 177.2, "txt": "el Tribunal Constitucional, por unanimidad,", "q": null}, {"ini": 177.0, "fin": 180.02, "txt": "la declaró <b>inconstitucional y nula</b>.", "q": null}, {"ini": 179.82, "fin": 182.16, "txt": "Pero el dinero ya estaba regularizado,", "q": null}, {"ini": 181.96, "fin": 184.32, "txt": "y no se pudo deshacer.", "q": null}, {"ini": 184.12, "fin": 186.8, "txt": "Cicerón, ante cualquier ley,", "q": null}, {"ini": 186.6, "fin": 187.84, "txt": "preguntaba lo mismo:", "q": null}, {"ini": 187.64, "fin": 189.04, "txt": "¿<b>cui bono</b>?", "q": null}, {"ini": 188.84, "fin": 190.66, "txt": "¿A quién beneficia?", "q": null}, {"ini": 190.46, "fin": 193.1, "txt": "Hazte esa pregunta con cada promesa,", "q": null}, {"ini": 192.9, "fin": 194.56, "txt": "de este partido y de todos.", "q": null}, {"ini": 195.36, "fin": 197.64, "txt": "El Decano saca su mapa.", "q": null}, {"ini": 197.44, "fin": 200.08, "txt": "Un estudio de la Universidad de Barcelona contó", "q": null}, {"ini": 199.88, "fin": 203.08, "txt": "todos los casos de corrupción de veinte años,", "q": null}, {"ini": 202.88, "fin": 209.11, "txt": "de dos mil a dos mil veinte:", "q": null}, {"ini": 208.91, "fin": 209.24, "txt": "<b>tres mil setecientos cuarenta y tres</b>.", "q": null}, {"ini": 209.04, "fin": 210.32, "txt": "Uno cada dos días.", "q": null}, {"ini": 210.12, "fin": 211.78, "txt": "Por comunidades:", "q": null}, {"ini": 211.58, "fin": 214.4, "txt": "<b>Andalucía</b>, mil veintiocho casos.", "q": null}, {"ini": 214.2, "fin": 218.02, "txt": "La <b>Comunidad Valenciana</b>, cuatrocientos cincuenta y cinco.", "q": null}, {"ini": 217.82, "fin": 220.48, "txt": "<b>Galicia</b>, trescientos treinta y ocho.", "q": null}, {"ini": 220.28, "fin": 222.48, "txt": "Entre las tres, casi la mitad.", "q": null}, {"ini": 222.28, "fin": 224.36, "txt": "Y por partidos:", "q": null}, {"ini": 224.16, "fin": 226.55, "txt": "<b>el PP</b> tiene el <b>cuarenta coma cinco</b> por", "q": null}, {"ini": 226.35, "fin": 228.0, "txt": "ciento de los casos.", "q": null}, {"ini": 227.8, "fin": 232.23, "txt": "El PSOE, el <b>treinta y ocho coma tres</b>.", "q": null}, {"ini": 232.03, "fin": 233.86, "txt": "Entre los dos, tres de cada cuatro.", "q": null}, {"ini": 233.66, "fin": 235.72, "txt": "Lección del Decano:", "q": null}, {"ini": 235.52, "fin": 238.24, "txt": "la corrupción no tiene <b>un solo color</b>.", "q": null}, {"ini": 238.04, "fin": 240.22, "txt": "Tiene más que ver con cuánto tiempo y", "q": null}, {"ini": 240.02, "fin": 241.82, "txt": "cuánto poder se tiene.", "q": null}, {"ini": 241.62, "fin": 243.42, "txt": "Por eso no basta con mirar al de", "q": null}, {"ini": 243.22, "fin": 243.86, "txt": "enfrente.", "q": null}, {"ini": 244.66, "fin": 247.46, "txt": "Platón contó el mito del <b>anillo de Giges</b>:", "q": null}, {"ini": 247.26, "fin": 249.66, "txt": "un pastor encuentra un anillo que lo hace", "q": null}, {"ini": 249.46, "fin": 251.68, "txt": "invisible y, como nadie lo ve,", "q": null}, {"ini": 251.48, "fin": 254.2, "txt": "empieza a hacer trampas.", "q": null}, {"ini": 254.0, "fin": 257.32, "txt": "¿Serías honrado si nadie te viera?", "q": null}, {"ini": 257.12, "fin": 259.64, "txt": "Una contabilidad en negro es eso:", "q": null}, {"ini": 259.44, "fin": 262.26, "txt": "un <b>anillo de Giges</b>.", "q": null}, {"ini": 262.06, "fin": 264.9, "txt": "Mismas reglas que con Sanchís:", "q": null}, {"ini": 264.7, "fin": 266.9, "txt": "nadie es culpable hasta que lo dice una", "q": null}, {"ini": 266.7, "fin": 267.92, "txt": "sentencia.", "q": null}, {"ini": 267.72, "fin": 271.26, "txt": "Por eso cada frasco lleva su <b>etiqueta exacta</b>.", "q": null}, {"ini": 271.06, "fin": 272.9, "txt": "Gürtel.", "q": null}, {"ini": 272.7, "fin": 274.24, "txt": "En dos mil dieciocho,", "q": null}, {"ini": 274.04, "fin": 278.3, "txt": "la Audiencia Nacional condenó al PP como partícipe", "q": null}, {"ini": 278.1, "fin": 280.18, "txt": "a título lucrativo:", "q": null}, {"ini": 279.98, "fin": 282.52, "txt": "se benefició de una trama de corrupción,", "q": null}, {"ini": 282.32, "fin": 285.2, "txt": "y tuvo que devolver doscientos cuarenta y cinco", "q": null}, {"ini": 285.0, "fin": 286.92, "txt": "mil euros.", "q": null}, {"ini": 286.72, "fin": 290.18, "txt": "El tribunal dio por probada una <b>caja B</b>.", "q": null}, {"ini": 289.98, "fin": 292.48, "txt": "El Supremo lo confirmó.", "q": null}, {"ini": 292.28, "fin": 294.87, "txt": "Y esa sentencia trajo la primera moción de", "q": null}, {"ini": 294.67, "fin": 298.18, "txt": "censura que triunfó en democracia.", "q": null}, {"ini": 297.98, "fin": 300.02, "txt": "La sede.", "q": null}, {"ini": 299.82, "fin": 301.12, "txt": "En dos mil veinticuatro,", "q": null}, {"ini": 300.92, "fin": 303.46, "txt": "el Supremo dio por probado que las obras", "q": null}, {"ini": 303.26, "fin": 305.68, "txt": "de la sede del PP se pagaron en", "q": null}, {"ini": 305.48, "fin": 307.16, "txt": "parte con <b>dinero negro</b>,", "q": null}, {"ini": 306.96, "fin": 309.06, "txt": "casi un millón de euros,", "q": null}, {"ini": 308.86, "fin": 310.92, "txt": "y recordó que la <b>caja B</b> era del", "q": null}, {"ini": 310.72, "fin": 312.27, "txt": "partido.", "q": null}, {"ini": 312.07, "fin": 313.62, "txt": "Kitchen.", "q": null}, {"ini": 313.42, "fin": 315.9, "txt": "El ministro del Interior de Rajoy y su", "q": null}, {"ini": 315.7, "fin": 319.5, "txt": "número dos, juzgados por supuestamente espiar al extesorero", "q": null}, {"ini": 319.3, "fin": 322.38, "txt": "del partido con dinero público.", "q": null}, {"ini": 322.18, "fin": 324.82, "txt": "La Fiscalía pide quince años.", "q": null}, {"ini": 324.62, "fin": 326.58, "txt": "El juicio acabó en julio,", "q": null}, {"ini": 326.38, "fin": 330.08, "txt": "y <b>falta la sentencia</b>.", "q": null}, {"ini": 329.88, "fin": 331.58, "txt": "Montoro.", "q": null}, {"ini": 331.38, "fin": 334.66, "txt": "El ministro de Hacienda de Rajoy está <b>investigado</b>", "q": null}, {"ini": 334.46, "fin": 337.46, "txt": "por supuestamente cambiar leyes a favor de empresas", "q": null}, {"ini": 337.26, "fin": 340.42, "txt": "que pagaban a su antiguo despacho.", "q": null}, {"ini": 340.22, "fin": 342.56, "txt": "Él lo niega.", "q": null}, {"ini": 342.36, "fin": 343.68, "txt": "Rato.", "q": null}, {"ini": 343.48, "fin": 346.68, "txt": "El vicepresidente económico de Aznar,", "q": null}, {"ini": 346.48, "fin": 348.92, "txt": "<b>condenado</b> de forma firme a cuatro años y", "q": null}, {"ini": 348.72, "fin": 351.26, "txt": "medio por las tarjetas black.", "q": null}, {"ini": 351.06, "fin": 353.28, "txt": "Y en dos mil veinticuatro,", "q": null}, {"ini": 353.08, "fin": 355.46, "txt": "<b>condenado</b> otra vez en primera instancia,", "q": null}, {"ini": 355.26, "fin": 358.76, "txt": "por fraude fiscal y blanqueo.", "q": null}, {"ini": 358.56, "fin": 360.96, "txt": "<b>Ha recurrido</b>.", "q": null}, {"ini": 360.76, "fin": 361.84, "txt": "Zaplana.", "q": null}, {"ini": 361.64, "fin": 364.96, "txt": "Expresidente valenciano y exministro,", "q": null}, {"ini": 364.76, "fin": 367.16, "txt": "<b>condenado</b> a diez años y cinco meses por", "q": null}, {"ini": 366.96, "fin": 369.24, "txt": "cohecho y blanqueo.", "q": null}, {"ini": 369.04, "fin": 371.7, "txt": "<b>Ha recurrido</b> al Supremo.", "q": null}, {"ini": 371.5, "fin": 372.71, "txt": "Granados.", "q": null}, {"ini": 372.51, "fin": 376.46, "txt": "Exconsejero madrileño, <b>condenado</b> en julio a dos años", "q": null}, {"ini": 376.26, "fin": 379.34, "txt": "y medio en una pieza de la Púnica.", "q": null}, {"ini": 379.14, "fin": 381.19, "txt": "Le quedan otros juicios.", "q": null}, {"ini": 381.49, "fin": 383.87, "txt": "¿Los escándalos de mi partido?", "q": "feijolo"}, {"ini": 383.67, "fin": 385.35, "txt": "Agua pasada…", "q": "feijolo"}, {"ini": 385.15, "fin": 387.1, "txt": "de anteayer, pero pasada.", "q": "feijolo"}, {"ini": 387.4, "fin": 389.22, "txt": "La dana.", "q": null}, {"ini": 389.02, "fin": 392.42, "txt": "Unas doscientas treinta personas murieron en Valencia en", "q": null}, {"ini": 392.22, "fin": 395.72, "txt": "octubre de dos mil veinticuatro.", "q": null}, {"ini": 395.52, "fin": 397.88, "txt": "El presidente valenciano, Mazón,", "q": null}, {"ini": 397.68, "fin": 400.98, "txt": "del PP, dimitió un año después.", "q": null}, {"ini": 400.78, "fin": 405.12, "txt": "El Tribunal Superior valenciano rechazó investigarlo:", "q": null}, {"ini": 404.92, "fin": 406.56, "txt": "<b>no ve delito</b>.", "q": null}, {"ini": 406.36, "fin": 408.8, "txt": "Lo que no responde una sentencia es la", "q": null}, {"ini": 408.6, "fin": 411.04, "txt": "<b>responsabilidad política</b>.", "q": null}, {"ini": 410.84, "fin": 412.6, "txt": "Las fotos.", "q": null}, {"ini": 412.4, "fin": 414.8, "txt": "En dos mil trece se publicaron fotos de", "q": null}, {"ini": 414.6, "fin": 416.86, "txt": "<b>Feijolo</b>, en los años noventa,", "q": null}, {"ini": 416.66, "fin": 420.58, "txt": "en el barco de un conocido contrabandista.", "q": null}, {"ini": 420.38, "fin": 422.9, "txt": "<b>No hay causa</b> ni delito.", "q": null}, {"ini": 422.7, "fin": 425.0, "txt": "Él dice que entonces no sabía a qué", "q": null}, {"ini": 424.8, "fin": 426.24, "txt": "se dedicaba.", "q": null}, {"ini": 426.54, "fin": 428.12, "txt": "¿Yo?", "q": "feijolo"}, {"ini": 427.92, "fin": 430.16, "txt": "En aquella época yo no sabía a qué", "q": "feijolo"}, {"ini": 429.96, "fin": 431.44, "txt": "se dedicaba.", "q": "feijolo"}, {"ini": 431.74, "fin": 434.76, "txt": "Heráclito decía que nadie se baña dos veces", "q": null}, {"ini": 434.56, "fin": 436.56, "txt": "en el <b>mismo río</b>.", "q": null}, {"ini": 436.36, "fin": 438.94, "txt": "<b>Feijolo</b> dice que su PP es otro,", "q": null}, {"ini": 438.74, "fin": 440.17, "txt": "un río nuevo.", "q": null}, {"ini": 440.47, "fin": 443.01, "txt": "Este es otro PP.", "q": "feijolo"}, {"ini": 442.81, "fin": 444.77, "txt": "Un río nuevo.", "q": "feijolo"}, {"ini": 444.57, "fin": 446.29, "txt": "Limpito.", "q": "feijolo"}, {"ini": 446.09, "fin": 447.65, "txt": "El cauce…", "q": "feijolo"}, {"ini": 447.45, "fin": 448.87, "txt": "mejor no lo miréis.", "q": "feijolo"}, {"ini": 449.17, "fin": 452.41, "txt": "Pero el cauce es el mismo.", "q": null}, {"ini": 452.21, "fin": 454.53, "txt": "La pregunta del Decano:", "q": null}, {"ini": 454.33, "fin": 456.47, "txt": "¿qué ha cambiado para que esto no vuelva", "q": null}, {"ini": 456.27, "fin": 457.79, "txt": "a pasar?", "q": null}, {"ini": 457.59, "fin": 460.24, "txt": "Pídeselo <b>con hechos</b>, no con palabras.", "q": null}, {"ini": 461.04, "fin": 463.21, "txt": "Para el veintinueve de noviembre,", "q": null}, {"ini": 463.01, "fin": 465.9, "txt": "<b>Feijolo</b> promete <b>bajar impuestos</b>.", "q": null}, {"ini": 465.7, "fin": 468.36, "txt": "Por ejemplo, que los autónomos que facturen menos", "q": null}, {"ini": 468.16, "fin": 470.2, "txt": "de ochenta y cinco mil euros al año", "q": null}, {"ini": 470.0, "fin": 471.69, "txt": "no paguen IVA.", "q": null}, {"ini": 471.99, "fin": 475.61, "txt": "Bajaré los impuestos, subiré las pensiones y os", "q": "feijolo"}, {"ini": 475.41, "fin": 478.07, "txt": "daré una casa a cada uno.", "q": "feijolo"}, {"ini": 477.87, "fin": 478.97, "txt": "¿Cómo?", "q": "feijolo"}, {"ini": 478.77, "fin": 480.94, "txt": "Eso es un detalle técnico.", "q": "feijolo"}, {"ini": 481.24, "fin": 484.44, "txt": "Bajar impuestos puede ser bueno.", "q": null}, {"ini": 484.24, "fin": 486.5, "txt": "Pero acuérdate de la mochila:", "q": null}, {"ini": 486.3, "fin": 488.45, "txt": "la deuda está en el ciento uno por", "q": null}, {"ini": 488.25, "fin": 490.3, "txt": "ciento del PIB.", "q": null}, {"ini": 490.1, "fin": 492.66, "txt": "¿Qué gasto se recorta para pagarlo?", "q": null}, {"ini": 492.46, "fin": 493.64, "txt": "Si no te lo dicen,", "q": null}, {"ini": 493.44, "fin": 494.13, "txt": "<b>pregúntalo</b>.", "q": null}, {"ini": 494.93, "fin": 498.01, "txt": "Balance, como en clase.", "q": null}, {"ini": 497.81, "fin": 499.27, "txt": "En un plato:", "q": null}, {"ini": 499.07, "fin": 502.23, "txt": "un líder que ganó cuatro veces en <b>Galicia</b>,", "q": null}, {"ini": 502.03, "fin": 503.93, "txt": "un partido que sacó al país de la", "q": null}, {"ini": 503.73, "fin": 505.31, "txt": "peor crisis del paro,", "q": null}, {"ini": 505.11, "fin": 508.31, "txt": "y que hoy promete <b>bajar impuestos</b>.", "q": null}, {"ini": 508.11, "fin": 509.71, "txt": "En el otro:", "q": null}, {"ini": 509.51, "fin": 514.15, "txt": "promesas incumplidas, una <b>amnistía fiscal</b> inconstitucional,", "q": null}, {"ini": 513.95, "fin": 516.49, "txt": "una <b>caja B</b> probada por los tribunales,", "q": null}, {"ini": 516.29, "fin": 519.03, "txt": "y una estantería de frascos que no para", "q": null}, {"ini": 518.83, "fin": 519.95, "txt": "de crecer.", "q": null}, {"ini": 519.75, "fin": 520.89, "txt": "Cuál pesa más…", "q": null}, {"ini": 520.69, "fin": 523.43, "txt": "no te lo vamos a decir.", "q": null}, {"ini": 523.23, "fin": 525.23, "txt": "Eso <b>lo decides tú</b>.", "q": null}, {"ini": 525.03, "fin": 528.03, "txt": "Hume escribió que el sabio ajusta lo que", "q": null}, {"ini": 527.83, "fin": 529.63, "txt": "cree <b>a las pruebas</b>.", "q": null}, {"ini": 529.43, "fin": 530.55, "txt": "No a los colores,
