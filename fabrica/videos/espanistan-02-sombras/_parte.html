 con Sanchís:", "q": null}, {"ini": 264.7, "fin": 266.9, "txt": "nadie es culpable hasta que lo dice una", "q": null}, {"ini": 266.7, "fin": 267.92, "txt": "sentencia.", "q": null}, {"ini": 267.72, "fin": 271.26, "txt": "Por eso cada frasco lleva su <b>etiqueta exacta</b>.", "q": null}, {"ini": 271.06, "fin": 272.9, "txt": "Gürtel.", "q": null}, {"ini": 272.7, "fin": 274.24, "txt": "En dos mil dieciocho,", "q": null}, {"ini": 274.04, "fin": 278.3, "txt": "la Audiencia Nacional condenó al PP como partícipe", "q": null}, {"ini": 278.1, "fin": 280.18, "txt": "a título lucrativo:", "q": null}, {"ini": 279.98, "fin": 282.52, "txt": "se benefició de una trama de corrupción,", "q": null}, {"ini": 282.32, "fin": 285.2, "txt": "y tuvo que devolver doscientos cuarenta y cinco", "q": null}, {"ini": 285.0, "fin": 286.92, "txt": "mil euros.", "q": null}, {"ini": 286.72, "fin": 290.18, "txt": "El tribunal dio por probada una <b>caja B</b>.", "q": null}, {"ini": 289.98, "fin": 292.48, "txt": "El Supremo lo confirmó.", "q": null}, {"ini": 292.28, "fin": 294.87, "txt": "Y esa sentencia trajo la primera moción de", "q": null}, {"ini": 294.67, "fin": 298.18, "txt": "censura que triunfó en democracia.", "q": null}, {"ini": 297.98, "fin": 300.02, "txt": "La sede.", "q": null}, {"ini": 299.82, "fin": 301.12, "txt": "En dos mil veinticuatro,", "q": null}, {"ini": 300.92, "fin": 303.46, "txt": "el Supremo dio por probado que las obras", "q": null}, {"ini": 303.26, "fin": 305.68, "txt": "de la sede del PP se pagaron en", "q": null}, {"ini": 305.48, "fin": 307.16, "txt": "parte con <b>dinero negro</b>,", "q": null}, {"ini": 306.96, "fin": 309.06, "txt": "casi un millón de euros,", "q": null}, {"ini": 308.86, "fin": 310.92, "txt": "y recordó que la <b>caja B</b> era del", "q": null}, {"ini": 310.72, "fin": 312.27, "txt": "partido.", "q": null}, {"ini": 312.07, "fin": 313.62, "txt": "Kitchen.", "q": null}, {"ini": 313.42, "fin": 315.9, "txt": "El ministro del Interior de Rajoy y su", "q": null}, {"ini": 315.7, "fin": 319.5, "txt": "número dos, juzgados por supuestamente espiar al extesorero", "q": null}, {"ini": 319.3, "fin": 322.38, "txt": "del partido con dinero público.", "q": null}, {"ini": 322.18, "fin": 324.82, "txt": "La Fiscalía pide quince años.", "q": null}, {"ini": 324.62, "fin": 326.58, "txt": "El juicio acabó en julio,", "q": null}, {"ini": 326.38, "fin": 330.08, "txt": "y <b>falta la sentencia</b>.", "q": null}, {"ini": 329.88, "fin": 331.58, "txt": "Montoro.", "q": null}, {"ini": 331.38, "fin": 334.66, "txt": "El ministro de Hacienda de Rajoy está <b>investigado</b>", "q": null}, {"ini": 334.46, "fin": 337.46, "txt": "por supuestamente cambiar leyes a favor de empresas", "q": null}, {"ini": 337.26, "fin": 340.42, "txt": "que pagaban a su antiguo despacho.", "q": null}, {"ini": 340.22, "fin": 342.56, "txt": "Él lo niega.", "q": null}, {"ini": 342.36, "fin": 343.68, "txt": "Rato.", "q": null}, {"ini": 343.48, "fin": 346.68, "txt": "El vicepresidente económico de Aznar,", "q": null}, {"ini": 346.48, "fin": 348.92, "txt": "<b>condenado</b> de forma firme a cuatro años y", "q": null}, {"ini": 348.72, "fin": 351.26, "txt": "medio por las tarjetas black.", "q": null}, {"ini": 351.06, "fin": 353.28, "txt": "Y en dos mil veinticuatro,", "q": null}, {"ini": 353.08, "fin": 355.46, "txt": "<b>condenado</b> otra vez en primera instancia,", "q": null}, {"ini": 355.26, "fin": 358.76, "txt": "por fraude fiscal y blanqueo.", "q": null}, {"ini": 358.56, "fin": 360.96, "txt": "<b>Ha recurrido</b>.", "q": null}, {"ini": 360.76, "fin": 361.84, "txt": "Zaplana.", "q": null}, {"ini": 361.64, "fin": 364.96, "txt": "Expresidente valenciano y exministro,", "q": null}, {"ini": 364.76, "fin": 367.16, "txt": "<b>condenado</b> a diez años y cinco meses por", "q": null}, {"ini": 366.96, "fin": 369.24, "txt": "cohecho y blanqueo.", "q": null}, {"ini": 369.04, "fin": 371.7, "txt": "<b>Ha recurrido</b> al Supremo.", "q": null}, {"ini": 371.5, "fin": 372.71, "txt": "Granados.", "q": null}, {"ini": 372.51, "fin": 376.46, "txt": "Exconsejero madrileño, <b>condenado</b> en julio a dos años", "q": null}, {"ini": 376.26, "fin": 379.34, "txt": "y medio en una pieza de la Púnica.", "q": null}, {"ini": 379.14, "fin": 381.19, "txt": "Le quedan otros juicios.", "q": null}, {"ini": 381.49, "fin": 383.87, "txt": "¿Los escándalos de mi partido?", "q": "feijolo"}, {"ini": 383.67, "fin": 385.35, "txt": "Agua pasada…", "q": "feijolo"}, {"ini": 385.15, "fin": 387.1, "txt": "de anteayer, pero pasada.", "q": "feijolo"}, {"ini": 387.4, "fin": 389.22, "txt": "La dana.", "q": null}, {"ini": 389.02, "fin": 392.42, "txt": "Unas doscientas treinta personas murieron en Valencia en", "q": null}, {"ini": 392.22, "fin": 395.72, "txt": "octubre de dos mil veinticuatro.", "q": null}, {"ini": 395.52, "fin": 397.88, "txt": "El presidente valenciano, Mazón,", "q": null}, {"ini": 397.68, "fin": 400.98, "txt": "del PP, dimitió un año después.", "q": null}, {"ini": 400.78, "fin": 405.12, "txt": "El Tribunal Superior valenciano rechazó investigarlo:", "q": null}, {"ini": 404.92, "fin": 406.56, "txt": "<b>no ve delito</b>.", "q": null}, {"ini": 406.36, "fin": 408.8, "txt": "Lo que no responde una sentencia es la", "q": null}, {"ini": 408.6, "fin": 411.04, "txt": "<b>responsabilidad política</b>.", "q": null}, {"ini": 410.84, "fin": 412.6, "txt": "Las fotos.", "q": null}, {"ini": 412.4, "fin": 414.8, "txt": "En dos mil trece se publicaron fotos de", "q": null}, {"ini": 414.6, "fin": 416.86, "txt": "<b>Feijolo</b>, en los años noventa,", "q": null}, {"ini": 416.66, "fin": 420.58, "txt": "en el barco de un conocido contrabandista.", "q": null}, {"ini": 420.38, "fin": 422.9, "txt": "<b>No hay causa</b> ni delito.", "q": null}, {"ini": 422.7, "fin": 425.0, "txt": "Él dice que entonces no sabía a qué", "q": null}, {"ini": 424.8, "fin": 426.24, "txt": "se dedicaba.", "q": null}, {"ini": 426.54, "fin": 428.12, "txt": "¿Yo?", "q": "feijolo"}, {"ini": 427.92, "fin": 430.16, "txt": "En aquella época yo no sabía a qué", "q": "feijolo"}, {"ini": 429.96, "fin": 431.44, "txt": "se dedicaba.", "q": "feijolo"}, {"ini": 431.74, "fin": 434.76, "txt": "Heráclito decía que nadie se baña dos veces", "q": null}, {"ini": 434.56, "fin": 436.56, "txt": "en el <b>mismo río</b>.", "q": null}, {"ini": 436.36, "fin": 438.94, "txt": "<b>Feijolo</b> dice que su PP es otro,", "q": null}, {"ini": 438.74, "fin": 440.17, "txt": "un río nuevo.", "q": null}, {"ini": 440.47, "fin": 443.01, "txt": "Este es otro PP.", "q": "feijolo"}, {"ini": 442.81, "fin": 444.77, "txt": "Un río nuevo.", "q": "feijolo"}, {"ini": 444.57, "fin": 446.29, "txt": "Limpito.", "q": "feijolo"}, {"ini": 446.09, "fin": 447.65, "txt": "El cauce…", "q": "feijolo"}, {"ini": 447.45, "fin": 448.87, "txt": "mejor no lo miréis.", "q": "feijolo"}, {"ini": 449.17, "fin": 452.41, "txt": "Pero el cauce es el mismo.", "q": null}, {"ini": 452.21, "fin": 454.53, "txt": "La pregunta del Decano:", "q": null}, {"ini": 454.33, "fin": 456.47, "txt": "¿qué ha cambiado para que esto no vuelva", "q": null}, {"ini": 456.27, "fin": 457.79, "txt": "a pasar?", "q": null}, {"ini": 457.59, "fin": 460.24, "txt": "Pídeselo <b>con hechos</b>, no con palabras.", "q": null}, {"ini": 461.04, "fin": 463.21, "txt": "Para el veintinueve de noviembre,", "q": null}, {"ini": 463.01, "fin": 465.9, "txt": "<b>Feijolo</b> promete <b>bajar impuestos</b>.", "q": null}, {"ini": 465.7, "fin": 468.36, "txt": "Por ejemplo, que los autónomos que facturen menos", "q": null}, {"ini": 468.16, "fin": 470.2, "txt": "de ochenta y cinco mil euros al año", "q": null}, {"ini": 470.0, "fin": 471.69, "txt": "no paguen IVA.", "q": null}, {"ini": 471.99, "fin": 475.61, "txt": "Bajaré los impuestos, subiré las pensiones y os", "q": "feijolo"}, {"ini": 475.41, "fin": 478.07, "txt": "daré una casa a cada uno.", "q": "feijolo"}, {"ini": 477.87, "fin": 478.97, "txt": "¿Cómo?", "q": "feijolo"}, {"ini": 478.77, "fin": 480.94, "txt": "Eso es un detalle técnico.", "q": "feijolo"}, {"ini": 481.24, "fin": 484.44, "txt": "Bajar impuestos puede ser bueno.", "q": null}, {"ini": 484.24, "fin": 486.5, "txt": "Pero acuérdate de la mochila:", "q": null}, {"ini": 486.3, "fin": 488.45, "txt": "la deuda está en el ciento uno por", "q": null}, {"ini": 488.25, "fin": 490.3, "txt": "ciento del PIB.", "q": null}, {"ini": 490.1, "fin": 492.66, "txt": "¿Qué gasto se recorta para pagarlo?", "q": null}, {"ini": 492.46, "fin": 493.64, "txt": "Si no te lo dicen,", "q": null}, {"ini": 493.44, "fin": 494.13, "txt": "<b>pregúntalo</b>.", "q": null}, {"ini": 494.93, "fin": 498.01, "txt": "Balance, como en clase.", "q": null}, {"ini": 497.81, "fin": 499.27, "txt": "En un plato:", "q": null}, {"ini": 499.07, "fin": 502.23, "txt": "un líder que ganó cuatro veces en <b>Galicia</b>,", "q": null}, {"ini": 502.03, "fin": 503.93, "txt": "un partido que sacó al país de la", "q": null}, {"ini": 503.73, "fin": 505.31, "txt": "peor crisis del paro,", "q": null}, {"ini": 505.11, "fin": 508.31, "txt": "y que hoy promete <b>bajar impuestos</b>.", "q": null}, {"ini": 508.11, "fin": 509.71, "txt": "En el otro:", "q": null}, {"ini": 509.51, "fin": 514.15, "txt": "promesas incumplidas, una <b>amnistía fiscal</b> inconstitucional,", "q": null}, {"ini": 513.95, "fin": 516.49, "txt": "una <b>caja B</b> probada por los tribunales,", "q": null}, {"ini": 516.29, "fin": 519.03, "txt": "y una estantería de frascos que no para", "q": null}, {"ini": 518.83, "fin": 519.95, "txt": "de crecer.", "q": null}, {"ini": 519.75, "fin": 520.89, "txt": "Cuál pesa más…", "q": null}, {"ini": 520.69, "fin": 523.43, "txt": "no te lo vamos a decir.", "q": null}, {"ini": 523.23, "fin": 525.23, "txt": "Eso <b>lo decides tú</b>.", "q": null}, {"ini": 525.03, "fin": 528.03, "txt": "Hume escribió que el sabio ajusta lo que", "q": null}, {"ini": 527.83, "fin": 529.63, "txt": "cree <b>a las pruebas</b>.", "q": null}, {"ini": 529.43, "fin": 530.55, "txt": "No a los colores,", "q": null}, {"ini": 530.35, "fin
