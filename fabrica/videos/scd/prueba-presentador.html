<!doctype html>
<!-- Prueba del presentador (fabrica/herramientas/presentador.js): window.vista(t, cam, gestos) dibuja un fotograma -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#111}</style>
<script type="importmap">{ "imports": { "three": "../../../vendor/three.module.min.js" } }</script>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
const { cargaPresentador } = await import('../../herramientas/presentador.js?v=' + Date.now());  // sin caché al probar
const ren = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
ren.setSize(540, 960); ren.outputColorSpace = THREE.SRGBColorSpace; ren.toneMapping = THREE.ACESFilmicToneMapping; ren.shadowMap.enabled = true;
const esc = new THREE.Scene(); esc.background = new THREE.Color(0x15171c);
esc.add(new THREE.HemisphereLight(0x9fb0ff, 0x221a14, .6));
const llave = new THREE.SpotLight(0xfff1dd, 60, 12, .5, .5, 1.5); llave.position.set(.8, 3.2, 2.2); llave.castShadow = true; esc.add(llave, llave.target); llave.target.position.set(0, 1.5, 0);
const nuca = new THREE.SpotLight(0xa8c0ff, 40, 12, .5, .5, 1.5); nuca.position.set(-1, 3, -2.5); esc.add(nuca, nuca.target); nuca.target.position.set(0, 1.5, 0);
const suelo = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshStandardMaterial({ color: 0x333333 })); suelo.rotation.x = -Math.PI / 2; suelo.receiveShadow = true; esc.add(suelo);
const cam = new THREE.PerspectiveCamera(30, 540 / 960, .01, 100);
const boca = await (await fetch('boca.json')).json();
const pr = await cargaPresentador(boca); esc.add(pr.obj);
window.pr = pr; window.THREE = THREE; window.ren = ren;
window.vista = (t, [px, py, pz, mx, my, mz, fov], gestos = [[0, 'abajo']], extra = {}) => {
  cam.position.set(px, py, pz); cam.lookAt(mx, my, mz); cam.fov = fov; cam.updateProjectionMatrix();
  pr.pon(t, { mira: cam.position.clone(), gestos, ...extra }); ren.render(esc, cam); };
// hoja: varias vistas en un lienzo para revisar de un vistazo
window.hoja = (lista, cols = 4, w = 270) => { const h = w * 16 / 9, cv = document.createElement('canvas'); cv.width = cols * w; cv.height = Math.ceil(lista.length / cols) * h;
  const x = cv.getContext('2d'); lista.forEach((a, i) => { a[3]?.antes?.(); window.vista(...a); x.drawImage(ren.domElement, (i % cols) * w, Math.floor(i / cols) * h, w, h);
    x.fillStyle = '#ff0'; x.font = '14px sans-serif'; x.fillText(String(a[3]?.etiqueta ?? a[0]), (i % cols) * w + 6, Math.floor(i / cols) * h + 16); });
  document.body.innerHTML = ''; document.body.append(cv); cv.style.width = '100%'; return cv.width + 'x' + cv.height; };
window.vista(1, [0, 1.55, 1.4, 0, 1.55, 0, 30]);
window.listo = true;
</script>
