     Elegir por código (A2, B1…) y luego se bajan solo los elegidos a audio/sfx/scd/. -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Efectos SCD</title>
<style>
  :root { --fondo: #0d0f14; --tarjeta: #171a22; --texto: #eef0f5; --suave: #9aa3b5; --rojo: #e0213a; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; } p.nota { color: var(--suave); margin: 0 0 18px; }
  h2 { font-size: 16px; margin: 26px 0 8px; border-left: 4px solid var(--rojo); padding-left: 8px; }
  h2 small { color: var(--suave); font-weight: 400; }
  .fila { display: grid; grid-template-columns: 44px 1fr; gap: 4px 10px; background: var(--tarjeta); border-radius: 8px; padding: 10px; margin: 6px 0; }
  .cod { font-weight: 800; color: var(--rojo); font-size: 18px; grid-row: span 2; align-self: center; }
  .tit { overflow-wrap: anywhere; } .tit a { color: var(--suave); font-size: 13px; margin-left: 6px; }
  audio { width: 100%; height: 34px; }
</style>
<main>
  <h1>Efectos para SCD · parte 1</h1>
  <p class="nota">Dale al play para escuchar (streaming, no se descarga nada). Dime los códigos que te gusten, uno por categoría, por ejemplo: A2 B1 C3…</p>

</main>

const lista = document.getElementById('lista');
for (const [letra, nombre, uso, items] of C) {
  const h = document.createElement('h2'); h.innerHTML = `${letra} · ${nombre} <small>— ${uso}</small>`; lista.append(h);
  items.forEach(([t, mp3, pag], i) => { const d = document.createElement('div'); d.className = 'fila';
    d.innerHTML = `<div class="cod">${letra}${i + 1}</div><div class="tit">${t}<a href="${pag}" target="_blank">ver en Pixabay</a></div><audio controls preload="none" src="${mp3}"></audio>`;
    lista.append(d); });
}
// que solo suene uno a la vez
document.addEventListener('play', e => document.querySelectorAll('audio').forEach(a => a !== e.target && a.pause()), true);
