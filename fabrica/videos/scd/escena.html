<script type="module">
import * as THREE from 'three';
import { EffectComposer, RenderPass, EffectPass, BloomEffect, VignetteEffect, ToneMappingEffect, ToneMappingMode,

import { GLTFLoader } from '../../../vendor/GLTFLoader.js';
import { cargaPersonaje, clipMixamo, sueldaPesos, alSuelo } from '../../herramientas/personajes.js';
import { cargaPresentador } from '../../herramientas/presentador.js';

const q = new URLSearchParams(location.search), W = 540, H = 960, ESC = +q.get('escala') || 1;
// tiempos de la voz (mezcla.py → tiempos.json): planos, cortes, golpes y tarjetas salen de ahí, nada a mano
const T = await (await fetch('tiempos.json')).json();
document.getElementById('lienzo').style.cssText += `width:${W}px;height:${H}px`;
const ren = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: false, stencil: false, depth: false, preserveDrawingBuffer: true });
ren.setPixelRatio(ESC); ren.setSize(W, H); ren.shadowMap.enabled = true; ren.shadowMap.type = THREE.PCFSoftShadowMap;
const esc = new THREE.Scene(); esc.background = new THREE.Color(0x05060b); esc.fog = new THREE.FogExp2(0x070912, .018);
const cam = new THREE.PerspectiveCamera(40, W / H, .05, 400);

// azar con semilla: el mismo fotograma sale siempre igual
let semilla = 7; const azar = () => ((semilla = (semilla * 16807) % 2147483647) - 1) / 2147483646;
const hash = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
const lerp = (a, b, k) => a + (b - a) * k, suave = k => k * k * (3 - 2 * k), lim = (k, a = 0, b = 1) => Math.max(a, Math.min(b, k));
const tramo = (t, a, b) => lim((t - a) / (b - a));
const V = (x, y, z) => new THREE.Vector3(x, y, z);

// ---------- arena: octógono con la lona a y = 0. A ×0,36 parecía de juguete; a ×1,45 aún «pequeño»: ahora ×1,75 en planta y ×1,1 en alto
// (jaula de ≈ 11 m, más que la grande de UFC; la valla sube a 1,9 m, no a 2,6). Girado 90°: la escalera y la puerta quedan
// al final del pasillo del walk-out (+z). K multiplica todas las distancias en planta que antes estaban a escala 0,36
const ESCALA = .36, K = 1.75, KY = 1.1, EXZ = ESCALA * K, EY = ESCALA * KY, SUELO = -4.8 * EY, PISTA = (2.6 - 4.8) * EY;  // PISTA: suelo de las sillas de pista
const S = K / 1.45, RC = 4.2 * S;  // S: las distancias medidas a mano con K = 1,45 crecen con la jaula · RC: radio máximo de las cámaras dentro (postes a r ≈ 3,2–3,5 K)
const X_PAS = -2.4 * K, Z_ESC = 4.85 * K, Z_PUERTA = 3.04 * K, X_PUERTA = -.4 * K;  // pasillo y escalera; puerta de la jaula
const oct = (await new GLTFLoader().loadAsync('../../../modelos/scd/octagono.glb')).scene;
oct.scale.set(EXZ, EY, EXZ); oct.rotation.y = Math.PI / 2; oct.position.y = SUELO; esc.add(oct);
const techo = /^(Plane033|Plane040|Cube032|Cube010|Cube008|Cube011|Cube009|Plane023)$/;
oct.traverse(o => { if (!o.isMesh) return; o.receiveShadow = true; if (techo.test(o.name)) o.castShadow = false;
  if (o.material?.color) o.material.color.multiplyScalar(.75); if (o.name === 'Tatami') o.material.color.multiplyScalar(.7); });
oct.updateMatrixWorld(true);
// el suelo de la jaula (lona, logos, plataforma) era metálico y claro: reflejaba los focos y quemaba la imagen → mate y más oscuro
oct.traverse(o => { if (!o.isMesh || !('roughness' in o.material)) return; const b = new THREE.Box3().setFromObject(o), c = b.getCenter(V(0, 0, 0));
  if (b.getSize(V(0, 0, 0)).y < .9 && Math.hypot(c.x, c.z) < 6 * S && c.y < .1) { o.material.roughness = .85; o.material.metalness = 0; o.material.color.multiplyScalar(.35); } });
// pasillo del walk-out (+z, alineado con la escalera): el bloque de sillas de ese lado se recorta en |x − X_PAS| < 1,6 m
ren.localClippingEnabled = true;
oct.traverse(o => { if (o.name === 'Cube056') { o.material = o.material.clone(); o.material.clipIntersection = true;
  o.material.clippingPlanes = [new THREE.Plane(V(-1, 0, 0), X_PAS - 1.6), new THREE.Plane(V(1, 0, 0), -X_PAS - 1.6)]; } });
// la puerta de la jaula gira sobre su bisagra (se abre para que entre Trump y se cierra detrás)
const puerta = oct.getObjectByName('Door'), cajaP = new THREE.Box3().setFromObject(puerta), bisagra = new THREE.Group();
bisagra.position.set(cajaP.max.x, 0, (cajaP.min.z + cajaP.max.z) / 2); esc.add(bisagra); bisagra.attach(puerta);

// marca SCD: lona del centro y las cuatro pantallas del marcador colgado
const lienzoTexto = (w, h, dibuja) => { const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  dibuja(cv.getContext('2d'), w, h); const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 4; return tx; };
const logo = lienzoTexto(1024, 1024, (x, w) => {
  x.translate(w / 2, w / 2); x.strokeStyle = 'rgba(255,255,255,.85)'; x.lineWidth = 14; x.beginPath(); x.arc(0, 0, 440, 0, 7); x.stroke();
  x.fillStyle = '#d0021b'; x.font = '900 330px Impact, Arial Black'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('SCD', 0, -20);
  x.fillStyle = '#fff'; x.font = '900 70px Arial Black'; x.fillText('SI SE DUPLICA', 0, 200); });
const lona = new THREE.Mesh(new THREE.PlaneGeometry(4.2 * K, 4.2 * K), new THREE.MeshStandardMaterial({ map: logo, transparent: true, roughness: .8, polygonOffset: true, polygonOffsetFactor: -4 }));
lona.material.color.setScalar(.35); lona.rotation.x = -Math.PI / 2; lona.position.y = .012; lona.receiveShadow = true; esc.add(lona);
const pantalla = (texto, sub) => lienzoTexto(1024, 600, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#16050a'); g.addColorStop(1, '#3a0610'); x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.fillStyle = '#fff'; x.font = `900 ${texto.length > 4 ? 230 : 300}px Impact, Arial Black`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.shadowColor = '#ff2a3a'; x.shadowBlur = 40; x.fillText(texto, w / 2, h * .46); x.shadowBlur = 0;
  x.fillStyle = '#ffd76a'; x.font = '900 64px Arial Black'; x.fillText(sub, w / 2, h * .84); });
const pantSCD = pantalla('SCD', 'SI SE DUPLICA'), pantTRUMP = pantalla('TRUMP', 'ESQUINA ROJA');
const matPant = new THREE.MeshBasicMaterial({ map: pantSCD, toneMapped: false });
for (let i = 0; i < 4; i++) { const m = new THREE.Mesh(new THREE.PlaneGeometry(12, 7), matPant), a = i * Math.PI / 2;
  m.position.set(Math.sin(a) * 6.3 * K, (13.8 - 1.7) * KY, Math.cos(a) * 6.3 * K); m.rotation.y = a; esc.add(m); }

// ---------- luces: arena a oscuras, la jaula muy iluminada
const hemi = new THREE.HemisphereLight(0x8aa0ff, 0x1a0d08, .35); esc.add(hemi);
const focos = []; for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + Math.PI / 4, f = new THREE.SpotLight(0xfff1dd, 900, 50, .46, .45, 1.6);
  f.position.set(Math.sin(a) * 7 * K, 12 * KY, Math.cos(a) * 7 * K); f.target.position.set(0, 0, 0); esc.add(f, f.target); focos.push(f); }
focos[0].castShadow = true; focos[0].shadow.mapSize.set(1024, 1024); focos[0].shadow.bias = -.0004;
const cenital = new THREE.SpotLight(0xffffff, 0, 14, .32, .6, 1.4); cenital.position.set(0, 7, .3); esc.add(cenital, cenital.target);
const color = new THREE.PointLight(0xff2030, 0, 30, 1.2); color.position.set(0, 5, 0); esc.add(color);  // tinte de los flashes
const azul = new THREE.SpotLight(0x3d6bff, 0, 40, .35, .5, 1.2); esc.add(azul, azul.target);
const grada = new THREE.DirectionalLight(0x9fb4ff, .5); grada.position.set(-10, 20, 30); esc.add(grada);
const halo = new THREE.Mesh(new THREE.PlaneGeometry(7, 7), new THREE.MeshBasicMaterial({ transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
  map: lienzoTexto(256, 256, (x, w) => { const g = x.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2); g.addColorStop(0, 'rgba(150,190,255,1)');
    g.addColorStop(.35, 'rgba(60,110,255,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(0, 0, w, w); }) }));
halo.position.set(X_PAS, PISTA + 1.3, 18.5 * K); halo.rotation.y = Math.PI; halo.visible = false; esc.add(halo);  // contraluz de la silueta (P11)
const sigue = new THREE.SpotLight(0xfff4e0, 0, 30, .16, .5, 1.2); sigue.castShadow = true; esc.add(sigue, sigue.target);  // foco de seguimiento del walk-out

// ---------- público: personas sencillas instanciadas (pista y gradas), saltan y aplauden
const rc = new THREE.Raycaster(), suelos = [];
oct.traverse(o => o.isMesh && /^(Ground|Cube0[2-5]\d)$/.test(o.name) && suelos.push(o));
const sitios = [];
for (let r = 7.6 * K; r < 23 * K; r += .95) for (let a = 0, n = Math.floor(2 * Math.PI * r / .7); a < n; a++) {
  const ang = a / n * 2 * Math.PI + r, x = Math.cos(ang) * r, z = Math.sin(ang) * r; if (z > 0 && Math.abs(x - X_PAS) < 1.7) continue;  // pasillo del walk-out
  sitios.push([x, PISTA, z]); }
for (let ru = 76; ru < 128; ru += 2.6) for (let a = 0, n = Math.floor(2 * Math.PI * ru * EXZ / .75); a < n; a++) {
  const ang = a / n * 2 * Math.PI + ru * .1, x = Math.cos(ang) * ru, z = Math.sin(ang) * ru;
  rc.set(V(x * EXZ, 40, z * EXZ), V(0, -1, 0)); const h = rc.intersectObjects(suelos, false)[0];
  if (h && h.point.y < 14 * KY + SUELO && h.point.y > PISTA + .2) sitios.push([x * EXZ, h.point.y, z * EXZ]); }
const N = sitios.length, cuerpoG = new THREE.CapsuleGeometry(.21, .5, 3, 7), cabezaG = new THREE.SphereGeometry(.13, 8, 6);
const cuerpos = new THREE.InstancedMesh(cuerpoG, new THREE.MeshStandardMaterial({ roughness: .9 }), N);
const cabezas = new THREE.InstancedMesh(cabezaG, new THREE.MeshStandardMaterial({ roughness: .8 }), N);
const camisetas = [0xd0021b, 0x1d1d1d, 0xf2f2f2, 0x1b3fa0, 0xffc400, 0x2e7d32, 0x6d4c41, 0xe91e63, 0x111a33, 0xff6f00];
const pieles = [0xf1c27d, 0xe0ac69, 0xc68642, 0x8d5524, 0xffdbac];
const fase = new Float32Array(N), salto = new Float32Array(N);
for (let i = 0; i < N; i++) { cuerpos.setColorAt(i, new THREE.Color(camisetas[Math.floor(azar() * camisetas.length)]));
  cabezas.setColorAt(i, new THREE.Color(pieles[Math.floor(azar() * pieles.length)])); fase[i] = azar() * 6.28; salto[i] = .04 + azar() * .16; }
esc.add(cuerpos, cabezas);
const _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(1, 1, 1);
const mueveGente = (t, animo) => { for (let i = 0; i < N; i++) {
  const [x, y, z] = sitios[i], b = Math.abs(Math.sin(t * (5 + salto[i] * 20) + fase[i])) * salto[i] * animo;
  _p.set(x, y + .46 + b, z); cuerpos.setMatrixAt(i, _m.compose(_p, _q, _s)); _p.y += .5; cabezas.setMatrixAt(i, _m.compose(_p, _q, _s)); }
  cuerpos.instanceMatrix.needsUpdate = cabezas.instanceMatrix.needsUpdate = true; };

// flashes de móviles en la grada
const nFl = 260, flashG = new THREE.BufferGeometry(), flPos = new Float32Array(nFl * 3), flVis = new Float32Array(nFl);
for (let i = 0; i < nFl; i++) { const s = sitios[Math.floor(azar() * N)]; flPos.set([s[0], s[1] + 1.3, s[2]], i * 3); }
flashG.setAttribute('position', new THREE.BufferAttribute(flPos, 3));
const flashes = new THREE.Points(flashG, new THREE.PointsMaterial({ color: 0xffffff, size: .35, transparent: true, opacity: .95, toneMapped: false }));
esc.add(flashes);
const mueveFlashes = t => { const k = Math.floor(t * 12); for (let i = 0; i < nFl; i++) flPos[i * 3 + 1] = hash(i * 7.3 + k) > .93 ? sitios[i % N][1] + 1.3 : -50;
  flashG.attributes.position.needsUpdate = true; };

// ---------- pirotecnia del túnel (walk-out): dos columnas de llamas aditivas que suben y parpadean, con su luz naranja
const llamaTx = lienzoTexto(128, 128, (x, w) => { const g = x.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  g.addColorStop(0, 'rgba(255,245,200,1)'); g.addColorStop(.35, 'rgba(255,150,40,.85)'); g.addColorStop(1, 'rgba(140,20,0,0)'); x.fillStyle = g; x.fillRect(0, 0, w, w); });
const nLl = 70, llamas = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ map: llamaTx, transparent: true,
  blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }), nLl * 2); llamas.frustumCulled = false; esc.add(llamas);
const luzFuego = new THREE.PointLight(0xff7a20, 0, 14, 1.4); esc.add(luzFuego);
const Z_TUNEL = 29.6 * S;
const mueveFuego = (t, on) => { llamas.visible = on; luzFuego.intensity = on ? 14 + 6 * Math.sin(t * 37) * Math.sin(t * 13) : 0; if (!on) return;
  luzFuego.position.set(X_PAS, PISTA + 2, Z_TUNEL - 1);
  for (let i = 0; i < nLl * 2; i++) { const c = i % 2 ? 1 : -1, f = (t * 1.7 + hash(i * 3.1)) % 1, h = f * 3.4, sc = (1 - f) * 1.3 + .3;
    _p.set(X_PAS + c * 1.4 + Math.sin(t * 9 + i) * .15 * f, PISTA + .2 + h, Z_TUNEL + Math.cos(t * 7 + i) * .15);
    llamas.setMatrixAt(i, _m.compose(_p, cam.quaternion, _s.set(sc, sc * 1.3, 1))); }
  _s.set(1, 1, 1); llamas.instanceMatrix.needsUpdate = true; };

// ---------- carteles con @ (comentarios con más likes) en las primeras filas, mirando a la jaula
const arrobas = (await (await fetch('arrobas.txt')).text()).split('\n').map(s => s.trim()).filter(s => s && !s.startsWith('#'));
const fondosCartel = ['#ffffff', '#ffd400', '#ff2d55', '#00c2ff', '#ffffff', '#7cff6b'];
const carteles = arrobas.map((a, i) => {
  const tx = lienzoTexto(512, 256, (x, w, h) => { x.fillStyle = fondosCartel[i % fondosCartel.length]; x.fillRect(0, 0, w, h);
    x.strokeStyle = '#111'; x.lineWidth = 10; x.strokeRect(5, 5, w - 10, h - 10);
    x.fillStyle = i % 6 === 2 ? '#fff' : '#111'; x.textAlign = 'center'; x.textBaseline = 'middle';
    let fs = 78; x.font = `900 ${fs}px Arial Black`; while (x.measureText('@' + a).width > w - 40) x.font = `900 ${fs -= 4}px Arial Black`;
    x.fillText('@' + a, w / 2, h * .46); x.font = '900 34px Arial Black'; x.fillText(['SCD!!', '❤ TRUMP', 'VAMOS!', '🇧🇷 MESTRE', 'SI SE DUPLICA', '🔥🔥🔥'][i % 6], w / 2, h * .82); });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1.1, .55), new THREE.MeshBasicMaterial({ map: tx, toneMapped: false }));
  m.material.color.setScalar(.85); m.add(new THREE.Mesh(m.geometry, m.material).rotateY(Math.PI));  // cara trasera: el texto nunca sale invertido
  const r = 7.7 * K + (i % 4) * .95; let ang = (i / arrobas.length) * Math.PI * 2 * 1.0 + (i % 4) * .37;
  if (Math.sin(ang) > 0 && Math.abs(Math.cos(ang) * r - X_PAS) < 3) ang += .7;  // fuera del pasillo del walk-out
  m.userData.base = V(Math.cos(ang) * r, PISTA + 1.85, Math.sin(ang) * r); m.position.copy(m.userData.base); m.lookAt(0, m.position.y, 0); m.userData.giro = m.rotation.clone();
  m.userData.fase = azar() * 6; esc.add(m); return m; });
// el cartel del final: «@TU_NOMBRE», en alto en primera fila (los que comparten salen en las gradas del próximo)
const cartelTu = new THREE.Mesh(new THREE.PlaneGeometry(1.4, .7), new THREE.MeshBasicMaterial({ toneMapped: false,
