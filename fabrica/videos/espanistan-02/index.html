168.25, "txt": "El Decano saca su mapa."}, {"ini": 168.05, "fin": 170.49, "txt": "Un estudio de la Universidad de Barcelona contó"}, {"ini": 170.29, "fin": 173.25, "txt": "todos los casos de corrupción de veinte años,"}, {"ini": 173.05, "fin": 178.78, "txt": "de dos mil a dos mil veinte:"}, {"ini": 178.58, "fin": 178.89, "txt": "<b>tres mil setecientos cuarenta y tres</b>."}, {"ini": 178.69, "fin": 179.91, "txt": "Uno cada dos días."}, {"ini": 179.71, "fin": 181.25, "txt": "Por comunidades:"}, {"ini": 181.05, "fin": 183.67, "txt": "<b>Andalucía</b>, mil veintiocho casos."}, {"ini": 183.47, "fin": 186.89, "txt": "La <b>Comunidad Valenciana</b>, cuatrocientos cincuenta y cinco."}, {"ini": 186.69, "fin": 189.23, "txt": "<b>Galicia</b>, trescientos treinta y ocho."}, {"ini": 189.03, "fin": 191.49, "txt": "Entre las tres, casi la mitad."}, {"ini": 191.29, "fin": 192.81, "txt": "Y por partidos:"}, {"ini": 192.61, "fin": 194.84, "txt": "<b>el PP</b> tiene el <b>cuarenta coma cinco</b> por"}, {"ini": 194.64, "fin": 195.81, "txt": "ciento de los casos."}, {"ini": 195.61, "fin": 200.05, "txt": "El PSOE, el <b>treinta y ocho coma tres</b>."}, {"ini": 199.85, "fin": 201.57, "txt": "Entre los dos, tres de cada cuatro."}, {"ini": 201.37, "fin": 203.27, "txt": "Lección del Decano:"}, {"ini": 203.07, "fin": 205.59, "txt": "la corrupción no tiene <b>un solo color</b>."}, {"ini": 205.39, "fin": 207.41, "txt": "Tiene más que ver con cuánto tiempo y"}, {"ini": 207.21, "fin": 208.89, "txt": "cuánto poder se tiene."}, {"ini": 208.69, "fin": 210.35, "txt": "Por eso no basta con mirar al de"}, {"ini": 210.15, "fin": 210.77, "txt": "enfrente."}, {"ini": 211.57, "fin": 214.17, "txt": "Platón contó el mito del <b>anillo de Giges</b>:"}, {"ini": 213.97, "fin": 216.19, "txt": "un pastor encuentra un anillo que lo hace"}, {"ini": 215.99, "fin": 218.09, "txt": "invisible y, como nadie lo ve,"}, {"ini": 217.89, "fin": 220.37, "txt": "empieza a hacer trampas."}, {"ini": 220.17, "fin": 223.23, "txt": "¿Serías honrado si nadie te viera?"}, {"ini": 223.03, "fin": 225.37, "txt": "Una contabilidad en negro es eso:"}, {"ini": 225.17, "fin": 227.79, "txt": "un <b>anillo de Giges</b>."}, {"ini": 227.59, "fin": 230.23, "txt": "Mismas reglas que con Sanchís:"}, {"ini": 230.03, "fin": 232.05, "txt": "nadie es culpable hasta que lo dice una"}, {"ini": 231.85, "fin": 233.01, "txt": "sentencia."}, {"ini": 232.81, "fin": 236.01, "txt": "Por eso cada frasco lleva su <b>etiqueta exacta</b>."}, {"ini": 235.81, "fin": 237.73, "txt": "Gürtel."}, {"ini": 237.53, "fin": 239.49, "txt": "En dos mil dieciocho,"}, {"ini": 239.29, "fin": 242.55, "txt": "la Audiencia Nacional condenó al PP como partícipe"}, {"ini": 242.35, "fin": 244.33, "txt": "a título lucrativo:"}, {"ini": 244.13, "fin": 246.43, "txt": "se benefició de una trama de corrupción,"}, {"ini": 246.23, "fin": 248.89, "txt": "y tuvo que devolver doscientos cuarenta y cinco"}, {"ini": 248.69, "fin": 250.55, "txt": "mil euros."}, {"ini": 250.35, "fin": 253.47, "txt": "El tribunal dio por probada una <b>caja B</b>."}, {"ini": 253.27, "fin": 255.63, "txt": "El Supremo lo confirmó."}, {"ini": 255.43, "fin": 257.91, "txt": "Y esa sentencia trajo la primera moción de"}, {"ini": 257.71, "fin": 260.83, "txt": "censura que triunfó en democracia."}, {"ini": 260.63, "fin": 262.43, "txt": "La sede."}, {"ini": 262.23, "fin": 263.91, "txt": "En dos mil veinticuatro,"}, {"ini": 263.71, "fin": 265.69, "txt": "el Supremo dio por probado que las obras"}, {"ini": 265.49, "fin": 267.73, "txt": "de la sede del PP se pagaron en"}, {"ini": 267.53, "fin": 269.05, "txt": "parte con <b>dinero negro</b>,"}, {"ini": 268.85, "fin": 270.43, "txt": "casi un millón de euros,"}, {"ini": 270.23, "fin": 272.57, "txt": "y recordó que la <b>caja B</b> era del"}, {"ini": 272.37, "fin": 273.89, "txt": "partido."}, {"ini": 273.69, "fin": 275.21, "txt": "Kitchen."}, {"ini": 275.01, "fin": 277.15, "txt": "El ministro del Interior de Rajoy y su"}, {"ini": 276.95, "fin": 280.45, "txt": "número dos, juzgados por supuestamente espiar al extesorero"}, {"ini": 280.25, "fin": 283.19, "txt": "del partido con dinero público."}, {"ini": 282.99, "fin": 285.35, "txt": "La Fiscalía pide quince años."}, {"ini": 285.15, "fin": 286.89, "txt": "El juicio acabó en julio,"}, {"ini": 286.69, "fin": 289.47, "txt": "y <b>falta la sentencia</b>."}, {"ini": 289.27, "fin": 291.51, "txt": "Montoro."}, {"ini": 291.31, "fin": 294.39, "txt": "El ministro de Hacienda de Rajoy está <b>investigado</b>"}, {"ini": 294.19, "fin": 296.99, "txt": "por supuestamente cambiar leyes a favor de empresas"}, {"ini": 296.79, "fin": 299.59, "txt": "que pagaban a su antiguo despacho."}, {"ini": 299.39, "fin": 301.67, "txt": "Él lo niega."}, {"ini": 301.47, "fin": 302.83, "txt": "Rato."}, {"ini": 302.63, "fin": 305.47, "txt": "El vicepresidente económico de Aznar,"}, {"ini": 305.27, "fin": 307.53, "txt": "<b>condenado</b> de forma firme a cuatro años y"}, {"ini": 307.33, "fin": 309.63, "txt": "medio por las tarjetas black."}, {"ini": 309.43, "fin": 311.51, "txt": "Y en dos mil veinticuatro,"}, {"ini": 311.31, "fin": 313.53, "txt": "<b>condenado</b> otra vez en primera instancia,"}, {"ini": 313.33, "fin": 316.55, "txt": "por fraude fiscal y blanqueo."}, {"ini": 316.35, "fin": 318.51, "txt": "<b>Ha recurrido</b>."}, {"ini": 318.31, "fin": 319.36, "txt": "Zaplana."}, {"ini": 319.16, "fin": 322.29, "txt": "Expresidente valenciano y exministro,"}, {"ini": 322.09, "fin": 324.31, "txt": "<b>condenado</b> a diez años y cinco meses por"}, {"ini": 324.11, "fin": 326.19, "txt": "cohecho y blanqueo."}, {"ini": 325.99, "fin": 328.33, "txt": "<b>Ha recurrido</b> al Supremo."}, {"ini": 328.13, "fin": 329.33, "txt": "Granados."}, {"ini": 329.13, "fin": 332.87, "txt": "Exconsejero madrileño, <b>condenado</b> en julio a dos años"}, {"ini": 332.67, "fin": 335.53, "txt": "y medio en una pieza de la Púnica."}, {"ini": 335.33, "fin": 337.37, "txt": "Le quedan otros juicios."}, {"ini": 337.17, "fin": 338.69, "txt": "La dana."}, {"ini": 338.49, "fin": 341.61, "txt": "Unas doscientas treinta personas murieron en Valencia en"}, {"ini": 341.41, "fin": 344.61, "txt": "octubre de dos mil veinticuatro."}, {"ini": 344.41, "fin": 346.73, "txt": "El presidente valenciano, Mazón,"}, {"ini": 346.53, "fin": 349.51, "txt": "del PP, dimitió un año después."}, {"ini": 349.31, "fin": 353.25, "txt": "El Tribunal Superior valenciano rechazó investigarlo:"}, {"ini": 353.05, "fin": 354.45, "txt": "<b>no ve delito</b>."}, {"ini": 354.25, "fin": 356.67, "txt": "Lo que no responde una sentencia es la"}, {"ini": 356.47, "fin": 358.79, "txt": "<b>responsabilidad política</b>."}, {"ini": 358.59, "fin": 360.23, "txt": "Las fotos."}, {"ini": 360.03, "fin": 362.23, "txt": "En dos mil trece se publicaron fotos de"}, {"ini": 362.03, "fin": 364.59, "txt": "<b>Feijolo</b>, en los años noventa,"}, {"ini": 364.39, "fin": 367.49, "txt": "en el barco de un conocido contrabandista."}, {"ini": 367.29, "fin": 369.61, "txt": "<b>No hay causa</b> ni delito."}, {"ini": 369.41, "fin": 371.57, "txt": "Él dice que entonces no sabía a qué"}, {"ini": 371.37, "fin": 373.07, "txt": "se dedicaba."}, {"ini": 372.87, "fin": 375.29, "txt": "Heráclito decía que nadie se baña dos veces"}, {"ini": 375.09, "fin": 376.81, "txt": "en el <b>mismo río</b>."}, {"ini": 376.61, "fin": 379.15, "txt": "<b>Feijolo</b> dice que su PP es otro,"}, {"ini": 378.95, "fin": 380.49, "txt": "un río nuevo."}, {"ini": 380.29, "fin": 382.55, "txt": "Pero el cauce es el mismo."}, {"ini": 382.35, "fin": 385.01, "txt": "La pregunta del Decano:"}, {"ini": 384.81, "fin": 386.77, "txt": "¿qué ha cambiado para que esto no vuelva"}, {"ini": 386.57, "fin": 387.99, "txt": "a pasar?"}, {"ini": 387.79, "fin": 390.23, "txt": "Pídeselo <b>con hechos</b>, no con palabras."}, {"ini": 391.03, "fin": 393.27, "txt": "Para el veintinueve de noviembre,"}, {"ini": 393.07, "fin": 395.53, "txt": "<b>Feijolo</b> promete <b>bajar impuestos</b>."}, {"ini": 395.33, "fin": 397.81, "txt": "Por ejemplo, que los autónomos que facturen menos"}, {"ini": 397.61, "fin": 399.49, "txt": "de ochenta y cinco mil euros al año"}, {"ini": 399.29, "fin": 401.17, "txt": "no paguen IVA."}, {"ini": 400.97, "fin": 403.47, "txt": "Bajar impuestos puede ser bueno."}, {"ini": 403.27, "fin": 405.43, "txt": "Pero acuérdate de la mochila:"}, {"ini": 405.23, "fin": 407.27, "txt": "la deuda está en el ciento uno por"}, {"ini": 407.07, "fin": 408.97, "txt": "ciento del PIB."}, {"ini": 408.77, "fin": 411.13, "txt": "¿Qué gasto se recorta para pagarlo?"}, {"ini": 410.93, "fin": 412.07, "txt": "Si no te lo dicen,"}, {"ini": 411.87, "fin": 412.5, "txt": "<b>pregúntalo</b>."}, {"ini": 413.3, "fin": 416.18, "txt": "Balance, como en clase."}, {"ini": 415.98, "fin": 417.4, "txt": "En un plato:"}, {"ini": 417.2, "fin": 420.04, "txt": "un líder que ganó cuatro veces en <b>Galicia</b>,"}, {"ini": 419.84, "fin": 421.6, "txt": "un partido que sacó al país de la"}, {"ini": 421.4, "fin": 422.88, "txt": "peor crisis del paro,"}, {"ini": 422.68, "fin": 425.66, "txt": "y que hoy promete <b>bajar impuestos</b>."}, {"ini": 425.46, "fin": 426.9, "txt": "En el otro:"}, {"ini": 426.7, "fin": 431.0, "txt": "promesas incumplidas, una <b>amnistía fiscal</b> inconstitucional,"}, {"ini": 430.8, "fin": 433.18, "txt": "una <b>caja B</b> probada por los tribunales,"}, {"ini": 432.98, "fin": 435.5, "txt": "y una estantería de frascos que no para"}, {"ini": 435.3, "fin": 436.36, "txt": "de crecer."}, {"ini": 436.16, "fin": 437.24, "txt": "Cuál pesa más…"}, {"ini": 437.04, "fin": 439.52, "txt": "no te lo vamos a decir."}, {"ini": 439.32, "fin": 441.2, "txt": "Eso <b>lo decides tú</b>."}, {"ini": 441.0, "fin": 443.78, "txt": "Hume escribió que el sabio ajusta lo que"}, {"ini": 443.58, "fin": 445.22, "txt": "cree <b>a las pruebas</b>."}, {"ini": 445.02, "fin": 446.08, "txt": "No a los colores,"}, {"ini": 445.88, "fin": 447.26, "txt": "ni a los gritos:"}, {"ini": 447.06, "fin": 448.48, "txt": "<b>a las pruebas</b>."}, {"ini": 448.28, "fin": 450.34, "txt": "Las tres preguntas de siempre:"}, {"ini": 450.14, "fin": 452.3, "txt": "¿qué prometieron, y qué cumplieron?"}, {"ini": 452.1, "fin": 454.18, "txt": "¿Son euros o porcentajes?"}, {"ini": 453.98, "fin": 455.42, "txt": "¿Me fío de la gente de la que"}, {"ini": 455.22, "fin": 456.48, "txt": "se rodean?"}, {"ini": 456.28, "fin": 458.42, "txt": "Aquí no te decimos a quién votar."}, {"ini": 458.22, "fin": 459.34, "txt": "Te decimos que votes,"}, {"ini": 459.14, "fin": 461.18, "txt": "y que <b>votes pensando</b>."}, {"ini": 460.98, "fin": 463.32, "txt": "En el próximo episodio de Españistán:"}, {"ini": 463.12, "fin": 464.62, "txt": "<b>el tercer partido</b>."}, {"ini": 464.42, "fin": 465.56, "txt": "Mismas reglas."}, {"ini": 465.36, "fin": 466.45, "txt": "Mismas preguntas."}, {"ini": 467.05, "fin": 468.51, "txt": "Y no te olvides:"}, {"ini": 468.31, "fin": 469.81, "txt": "<b>dale a like</b>, <b>suscríbete</b>,"}, {"ini": 469.61, "fin": 471.73, "txt": "y activa <b>la campana</b> para que te avisemos"}, {"ini": 471.53, "fin": 472.86, "txt": "del próximo episodio."}], "PLANOS": [{"en": 0, "tipo": "cueva", "cam": [640, 300, 1.15], "cam2": [450, 210, 1.9], "musica": "misterio", "ini": 0, "fin": 6.026735}, {"en": "2:El filósofo", "tipo": "decano", "cam": [870, 245, 2.6], "cam2": [860, 250, 2.2], "musica": "misterio", "zooms": [[15.136735, 640, 360, 1.05, 1.2]], "capas": [{"tipo": "cita", "autor": "GEORGE SANTAYANA · 1905", "texto": "Quien no recuerda su pasado está condenado a repetirlo.", "en": "2:escribió", "hasta": "2:Por eso", "ini": 8.236735, "fin": 12.416735}, {"tipo": "sello", "texto": "TODO UN PARTIDO", "en": "2:todo un partido", "ini": 15.716735, "fin": 16.766734999999997}], "ini": 6.026735, "fin": 16.866735}, {"en": "3:Este es Feijolo", "tipo": "marioneta", "cam": [630, 130, 2.6], "cam2": [640, 260, 1.2], "capas": [{"tipo": "dato", "valor": "FEIJOLO", "texto": "Líder de la oposición", "en": "3:Feijolo", "hasta": "3:Y este", "color": "rojo", "ini": 17.796734999999998, "fin": 20.176734999999997}, {"tipo": "dato", "valor": "PP", "texto": "Su partido", "color": "pp", "en": "3:el PP", "hasta": "3:uno de los dos", "ini": 21.416735, "fin": 22.296734999999998}, {"tipo": "linea", "titulo": "Quién ha gobernado Españistán", "en": "3:uno de los dos", "ini": 22.296734999999998, "fin": 26.405101999999996}], "ini": 16.866735, "fin": 26.505101999999997}, {"en": "4:Mismas reglas", "tipo": "imagen", "fondo": "portada", "cam": [640, 520, 1.5], "cam2": [640, 520, 1.3], "capas": [{"tipo": "lista", "titulo": "Mismas reglas", "items": [{"texto": "Datos públicos", "en": "4:datos públicos", "ini": 28.675101999999995}, {"texto": "La palabra exacta de cada sentencia", "en": "4:la palabra exacta", "ini": 29.735101999999998}, {"texto": "Lo bueno también se cuenta", "en": "4:lo bueno", "ini": 31.815101999999996}], "ini": 26.805101999999998, "fin": 33.805102}], "ini": 26.505101999999997, "fin": 33.905102}, {"en": "5:Feijolo presidió", "tipo": "marioneta", "cam": [630, 140, 2.4], "cam2": [640, 300, 1.2], "capas": [{"tipo": "dato", "valor": "4", "texto": "mayorías absolutas en Galicia (2009-2022)", "fuente": "Xunta de Galicia", "en": "5:cuatro mayorías", "hasta": "5:En dos mil veintidós pasó", "ini": 39.455102, "fin": 41.995102}, {"tipo": "dato", "valor": "137", "texto": "escaños en 2023: el más votado", "fuente": "Ministerio del Interior", "en": "5:ciento treinta y siete", "ini": 48.063102, "fin": 50.305102}], "ini": 33.905102, "fin": 50.405102}, {"en": "5:Pero no gobernó", "tipo": "marioneta", "cam": [640, 260, 1.25], "cam2": [630, 150, 2.2], "capas": [{"tipo": "dato", "valor": "172 de 176", "texto": "votos que sacó en su investidura", "fuente": "Congreso, 27-9-2023", "color": "rojo", "en": "5:ciento setenta y dos", "hasta": "5:Primera lección", "ini": 53.448435333333336, "fin": 57.255102}, {"tipo": "sello", "texto": "GANAR ≠ GOBERNAR", "en": "5:ganar no es gobernar", "ini": 61.455102, "fin": 6 // ---------- cámara: cam al empezar, cam2 al acabar, y zooms [t, x, y, z, duración] ----------

    const parpadea = (t % 3.7) < .13;
    if (p.brillo) p.brillo.style.opacity = .35 + .45 * (.5 + .22 * Math.sin(t * 7.3) + .16 * Math.sin(t * 13.1 + 1) + .12 * Math.sin(t * 3.7 + 2));
    if (p.titere) { p.titere.style.transform = `scale(${1 + .004 * Math.sin(t * 2.2)}, ${1 + .007 * Math.sin(t * 2.2)})`;
      p.cabeza.style.transform = `rotate(${1.6 * Math.sin(t * 1.3) + .8 * Math.sin(t * 3.1)}deg)`; p.mano.style.transform = `rotate(${-3 + 4 * Math.sin(t * 2.4)}deg)`; }

      const pts = [[700, 640], [790, 420], [1010, 430], [1250, 420], [1300, 640]], seg = clamp(u / 1.1, 0, 3.99), i = Math.floor(seg), f = suave(seg - i);
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1]; cur.style.left = (x0 + (x1 - x0) * f) + 'px'; cur.style.top = (y0 + (y1 - y0) * f) + 'px';
      cur.style.opacity = vis ? Math.min(a, o) : 0; cur.style.transform = `rotate(-25deg) scale(${[1.1, 2.2, 3.3].some(c => u > c && u < c + .15) ? .8 : 1})`;
      const liked = u > 1.1, subs = u > 2.2, rang = u > 3.3;
      lk.style.background = liked ? '#1f6feb' : '#f4efe6'; lk.style.transform = `scale(${liked && u < 1.4 ? 1.2 : 1})`;
      bt.style.background = subs ? '#606060' : '#cc0000'; bt.textContent = subs ? 'SUSCRITO ✓' : 'SUSCRIBIRSE';
      bl.style.transform = `rotate(${rang ? 22 * Math.sin((u - 3.3) * 18) * Math.max(0, 1 - (u - 3.3) / 1.5) : 0}deg)`; bl.style.background = rang ? '#f2c14e' : '#f4efe6'; }
    if (k.c && k.c.anim) k.c.anim.forEach((x, i) => { const it = (k.c.items || [])[i], t0 = it && it.ini != null ? it.ini : k.ini + .4 + i * .5;
      const q = clamp((t - t0) / .4); if (x.classList.contains('b') || x.classList.contains('tramo')) x.style.transform = `scaleX(${suave(q)})`; else x.style.opacity = q; });
