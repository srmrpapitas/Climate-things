ró un partido nuevo:", "q": null}, {"ini": 112.05, "fin": 113.14, "txt": "<b>Vox</b>.", "q": null}, {"ini": 112.94, "fin": 114.9, "txt": "<b>Acascar</b> lo resume así.", "q": null}, {"ini": 115.2, "fin": 118.44, "txt": "A mí nadie me ha regalado nada.", "q": "acascar"}, {"ini": 118.24, "fin": 119.56, "txt": "Bueno...", "q": "acascar"}, {"ini": 119.36, "fin": 121.18, "txt": "salvo aquel sueldo.", "q": "acascar"}, {"ini": 120.98, "fin": 122.69, "txt": "Pero era vocación.", "q": "acascar"}, {"ini": 122.99, "fin": 126.71, "txt": "<b>Vox</b> nace de militantes del PP enfadados con", "q": null}, {"ini": 126.51, "fin": 128.33, "txt": "<b>Rajoy</b>.", "q": null}, {"ini": 128.13, "fin": 130.25, "txt": "Lo acusaban de ser <b>blando</b>:", "q": null}, {"ini": 130.05, "fin": 131.95, "txt": "con los presos de <b>ETA</b> que salieron de", "q": null}, {"ini": 131.75, "fin": 133.97, "txt": "la cárcel, con los impuestos,", "q": null}, {"ini": 133.77, "fin": 137.19, "txt": "y con el independentismo catalán.", "q": null}, {"ini": 136.99, "fin": 139.47, "txt": "En la mesa fundadora estaban <b>Acascar</b>;", "q": null}, {"ini": 139.27, "fin": 143.85, "txt": "Alejo Vidal-Quadras, antiguo líder del PP catalán;", "q": null}, {"ini": 143.65, "fin": 145.73, "txt": "y José Antonio <b>Ortega Lara</b>,", "q": null}, {"ini": 145.53, "fin": 147.99, "txt": "el funcionario de prisiones que <b>ETA</b> tuvo secuestrado", "q": null}, {"ini": 147.79, "fin": 149.99, "txt": "<b>quinientos treinta y dos días</b>.", "q": null}, {"ini": 149.79, "fin": 152.61, "txt": "Se presentaron a las europeas de dos mil", "q": null}, {"ini": 152.41, "fin": 155.13, "txt": "catorce, y no sacaron <b>ni un escaño</b>.", "q": null}, {"ini": 154.93, "fin": 157.35, "txt": "Aquella campaña costó cerca de un millón de", "q": null}, {"ini": 157.15, "fin": 159.63, "txt": "euros, y el <b>ochenta por ciento</b> lo pusieron", "q": null}, {"ini": 159.43, "fin": 162.33, "txt": "simpatizantes de un grupo de la <b>oposición iraní</b>", "q": null}, {"ini": 162.13, "fin": 163.44, "txt": "en el exilio.", "q": null}, {"ini": 163.24, "fin": 166.59, "txt": "Vidal-Quadras dijo que esos donativos eran para él.", "q": null}, {"ini": 166.39, "fin": 168.89, "txt": "<b>Acascar</b> dijo que <b>todo era legal</b>.", "q": null}, {"ini": 168.69, "fin": 171.01, "txt": "Nunca hubo una <b>causa judicial</b>.", "q": null}, {"ini": 170.81, "fin": 173.95, "txt": "Vidal-Quadras se fue al año siguiente.", "q": null}, {"ini": 173.75, "fin": 176.48, "txt": "De aquella mesa, hoy solo queda <b>Ortega Lara</b>.", "q": null}, {"ini": 177.28, "fin": 179.78, "txt": "Cuatro años casi invisibles.", "q": null}, {"ini": 179.58, "fin": 181.92, "txt": "Y en dos mil dieciocho,", "q": null}, {"ini": 181.72, "fin": 183.2, "txt": "de golpe:", "q": null}, {"ini": 183.0, "fin": 186.04, "txt": "<b>doce diputados</b> en Andalucía.", "q": null}, {"ini": 185.84, "fin": 188.22, "txt": "Abril de dos mil diecinueve:", "q": null}, {"ini": 188.02, "fin": 190.66, "txt": "veinticuatro diputados en el Congreso.", "q": null}, {"ini": 190.46, "fin": 192.83, "txt": "Noviembre de dos mil diecinueve:", "q": null}, {"ini": 192.63, "fin": 195.16, "txt": "<b>cincuenta y dos</b>, tercera fuerza.", "q": null}, {"ini": 194.96, "fin": 198.34, "txt": "En dos mil veintitrés bajó a treinta y", "q": null}, {"ini": 198.14, "fin": 198.56, "txt": "tres.", "q": null}, {"ini": 198.36, "fin": 200.79, "txt": "Y en octubre de dos mil veintiséis,", "q": null}, {"ini": 200.59, "fin": 203.04, "txt": "dos encuestas le dan el <b>diecinueve por ciento</b>", "q": null}, {"ini": 202.84, "fin": 204.88, "txt": "y unos <b>sesenta y ocho</b> escaños,", "q": null}, {"ini": 204.68, "fin": 206.08, "txt": "su mejor marca.", "q": null}, {"ini": 205.88, "fin": 209.82, "txt": "Sube sobre todo entre los menores de cuarenta", "q": null}, {"ini": 209.62, "fin": 211.02, "txt": "y cinco años, y con votos que se", "q": null}, {"ini": 210.82, "fin": 212.34, "txt": "van del PP.", "q": null}, {"ini": 212.14, "fin": 213.84, "txt": "Lo bueno también se cuenta:", "q": null}, {"ini": 213.64, "fin": 216.74, "txt": "millones de personas sienten que <b>nadie les escuchaba</b>,", "q": null}, {"ini": 216.54, "fin": 218.52, "txt": "y <b>Vox</b> les habla de vivienda,", "q": null}, {"ini": 218.32, "fin": 220.38, "txt": "de <b>inmigración</b> y de seguridad.", "q": null}, {"ini": 220.18, "fin": 222.68, "txt": "Eso no se puede despreciar:", "q": null}, {"ini": 222.48, "fin": 224.21, "txt": "<b>se debe entender</b>.", "q": null}, {"ini": 224.01, "fin": 226.2, "txt": "<b>Acascar</b> tiene su propia teoría.", "q": null}, {"ini": 226.5, "fin": 228.96, "txt": "Los jóvenes me adoran.", "q": "acascar"}, {"ini": 228.76, "fin": 230.75, "txt": "Será por el caballo.", "q": "acascar"}, {"ini": 231.05, "fin": 232.89, "txt": "Pregunta del Decano:", "q": null}, {"ini": 232.69, "fin": 234.53, "txt": "¿se vota a alguien por lo que <b>propone</b>,", "q": null}, {"ini": 234.33, "fin": 235.92, "txt": "o por <b>contra quién</b> está?", "q": null}, {"ini": 236.72, "fin": 239.6, "txt": "<b>Vox</b> prometió acabar con los <b>chiringuitos</b>:", "q": null}, {"ini": 239.4, "fin": 241.7, "txt": "el <b>dinero público</b> que se gasta en organismos", "q": null}, {"ini": 241.5, "fin": 244.19, "txt": "y fundaciones para colocar a los afines.", "q": null}, {"ini": 243.99, "fin": 246.15, "txt": "<b>Acascar</b> lo dice sin rodeos.", "q": null}, {"ini": 246.45, "fin": 249.87, "txt": "Hay que cerrar todos los <b>chiringuitos</b>.", "q": "acascar"}, {"ini": 249.67, "fin": 252.03, "txt": "Empezando por los de los demás.", "q": "acascar"}, {"ini": 252.33, "fin": 254.81, "txt": "Y aquí, la <b>letra pequeña</b>.", "q": null}, {"ini": 254.61, "fin": 257.45, "txt": "<b>Vox</b> vive, como todos los partidos,", "q": null}, {"ini": 257.25, "fin": 259.45, "txt": "sobre todo de <b>dinero público</b>.", "q": null}, {"ini": 259.25, "fin": 262.1, "txt": "Y entre dos mil veintitrés y dos mil", "q": null}, {"ini": 261.9, "fin": 264.43, "txt": "veinticuatro pasó <b>cuatro millones y medio</b> a su", "q": null}, {"ini": 264.23, "fin": 266.73, "txt": "propia fundación, <b>Disenso</b>.", "q": null}, {"ini": 266.53, "fin": 270.03, "txt": "En dos mil veintitrés entró en <b>cinco gobiernos</b>", "q": null}, {"ini": 269.83, "fin": 272.45, "txt": "autonómicos con el PP.", "q": null}, {"ini": 272.25, "fin": 274.89, "txt": "En julio de dos mil veinticuatro se salió", "q": null}, {"ini": 274.69, "fin": 278.95, "txt": "de todos, por el reparto de <b>menores migrantes</b>.", "q": null}, {"ini": 278.75, "fin": 281.11, "txt": "En dos mil veintiséis ha vuelto:", "q": null}, {"ini": 280.91, "fin": 287.11, "txt": "vicepresidencias en Extremadura, Aragón y Castilla y León,", "q": null}, {"ini": 286.91, "fin": 289.59, "txt": "con la <b>prioridad nacional</b> en las ayudas sociales", "q": null}, {"ini": 289.39, "fin": 291.53, "txt": "como bandera.", "q": null}, {"ini": 291.33, "fin": 294.37, "txt": "Cicerón preguntaba ante cada ley:", "q": null}, {"ini": 294.17, "fin": 296.41, "txt": "¿<b>a quién beneficia</b>?", "q": null}, {"ini": 296.21, "fin": 298.17, "txt": "Y ante cada promesa,", "q": null}, {"ini": 297.97, "fin": 299.69, "txt": "otra pregunta:", "q": null}, {"ini": 299.49, "fin": 301.51, "txt": "¿se ha cumplido <b>donde ya mandan</b>?", "q": null}, {"ini": 302.31, "fin": 305.35, "txt": "<b>Juvenal</b>, un poeta romano,", "q": null}, {"ini": 305.15, "fin": 308.79, "txt": "hizo la pregunta más incómoda de la política:", "q": null}, {"ini": 308.59, "fin": 311.45, "txt": "¿quién <b>vigila a los vigilantes</b>?", "q": null}, {"ini": 311.25, "fin": 314.23, "txt": "Un partido que promete limpiar también tiene que", "q": null}, {"ini": 314.03, "fin": 316.23, "txt": "dejarse mirar.", "q": null}, {"ini": 316.03, "fin": 318.27, "txt": "Mismas reglas:", "q": null}, {"ini": 318.07, "fin": 320.25, "txt": "nadie es culpable hasta que lo dice una", "q": null}, {"ini": 320.05, "fin": 323.99, "txt": "<b>sentencia</b>, y cada frasco lleva su etiqueta.", "q": null}, {"ini": 323.79, "fin": 327.37, "txt": "Primer frasco, el dinero iraní de dos mil", "q": null}, {"ini": 327.17, "fin": 327.79, "txt": "catorce:", "q": null}, {"ini": 327.59, "fin": 330.81, "txt": "el <b>ochenta por ciento</b> de la campaña europea.", "q": null}, {"ini": 330.61, "fin": 333.45, "txt": "Nunca hubo causa.", "q": null}, {"ini": 333.25, "fin": 334.77, "txt": "Etiqueta:", "q": null}, {"ini": 334.57, "fin": 335.63, "txt": "<b>sin causa</b>.", "q": null}, {"ini": 336.43, "fin": 339.35, "txt": "Segundo frasco, el <b>banco húngaro</b>.", "q": null}, {"ini": 339.15, "fin": 340.91, "txt": "En dos mil veintitrés,", "q": null}, {"ini": 340.71, "fin": 342.95, "txt": "<b>Vox</b> pidió seis millones y medio a un", "q": null}, {"ini": 342.75, "fin": 346.43, "txt": "<b>banco húngaro</b> cercano al Gobierno de <b>Orbán</b>.", "q": null}, {"ini": 346.23, "fin": 349.19, "txt": "Anticorrupción lo miró en dos mil veinticinco y", "q": null}, {"ini": 348.99, "fin": 350.43, "txt": "lo archivó:", "q": null}, {"ini": 350.23, "fin": 351.85, "txt": "el préstamo se devolvió,", "q": null}, {"ini": 351.65, "fin": 353.47, "txt": "y no vio delito.", "q": null}, {"ini": 353.27, "fin": 354.57, "txt": "Etiqueta:", "q": null}, {"ini": 354.37, "fin": 355.42, "txt": "<b>archivado</b>.", "q": null}, {"ini": 355.22, "fin": 357.5, "txt": "<b>Acascar</b> tiene una explicación.", "q": null}, {"ini": 357.8, "fin": 360.82, "txt": "Los bancos españoles no me querían.", "q": "acascar"}, {"ini": 360.62, "fin": 362.82, "txt": "Los húngaros, sí.", "q": "acascar"}, {"ini": 362.62, "fin": 364.43, "txt": "Será por el idioma.", "q": "acascar"}, {"ini": 364.73, "fin": 368.29, "txt": "Tercer frasco, las huchas.", "q": null}, {"ini": 368.09, "fin": 370.25, "txt": "El Tribunal de Cuentas multó a <b>Vox</b> con", "q": null}, {"ini": 370.05, "fin": 372.69, "txt": "<b>ochocientos sesenta y dos mil</b> euros:", "q": null}, {"ini": 372.49, "fin": 374.33, "txt": "decía que el dinero de las huchas de", "q": null}, {"ini": 374.13, "fin": 377.05, "txt": "sus puestos eran donativos ilegales.", "q": null}, {"ini": 376.85, "fin": 379.01, "txt": "En junio de dos mil veintiséis,", "q": null}, {"ini": 378.81, "fin": 380.99, "txt": "el Supremo <b>anuló la multa</b>:", "q": null}, {"ini": 380.79, "fin": 382.33, "txt": "no se probó.", "q": null}, {"ini": 382.13, "fin": 383.19, "txt": "Etiqueta:", "q": null}, {"ini": 382.99, "fin": 384.37, "txt": "<b>anulado</b>.", "q": null}, {"ini": 384.17, "fin": 385.85, "txt": "Esto también se cuenta.", "q": null}, {"ini": 385.65, "fin": 388.71, "txt": "Cuarto frasco, los proveedores.", "q": null}, {"ini": 388.51, "fin": 391.15, "txt": "<b>Vox</b> paga casi <b>veintisiete mil</b> euros al mes", "q": null}, {"ini": 390.95, "fin": 393.05, "txt": "a la empresa del asesor de <b>Acascar</b>,", "q": null}, {"ini": 392.85, "fin": 395.55, "txt": "una sociedad <b>sin empleados</b>.", "q": null}, {"ini": 395.35, "fin": 397.44, "txt": "Y la mujer de <b>Acascar</b> cobra sesenta y", "q": null}, {"ini": 397.24, "fin": 399.61, "txt": "tres mil seiscientos euros al año de una", "q": null}, {"ini": 399.41, "fin": 403.19, "txt": "editorial de la misma familia empresarial.", "q": null}, {"ini": 402.99, "fin": 405.57, "txt": "<b>Vox</b> dice que el Tribunal de Cuentas revisó", "q": null}, {"ini": 405.37, "fin": 408.95, "txt": "esos contratos sin ver irregularidades.", "q": null}, {"ini": 408.75, "fin": 413.69, "txt": "PP y PSOE piden que audite su fundación.", "q": null}, {"ini": 413.49, "fin": 414.73, "txt": "Etiqueta:", "q": null}, {"ini": 414.53, "fin": 416.45, "txt": "<b>sin causa</b>.", "q": null}, {"ini": 416.25, "fin": 418.25, "txt": "<b>Preguntas abiertas</b>.", "q": null}, {"ini": 418.05, "fin": 420.67, "txt": "Quinto frasco, la dana.", "q": null}, {"ini": 420.47, "fin": 423.69, "txt": "<b>Revuelta</b>, una asociación juvenil cercana a <b>Vox</b>,", "q": null}, {"ini": 423.49, "fin": 427.29, "txt": "recogió donativos para los afectados de Valencia.", "q": null}, {"ini": 427.09, "fin": 429.69, "txt": "Dos miembros de <b>Vox</b> la denunciaron por quedarse", "q": null}, {"ini": 429.49, "fin": 431.21, "txt": "parte del dinero.", "q": null}, {"ini": 431.01, "fin": 433.89, "txt": "La <b>Fiscalía</b> archivó la denuncia en abril de", "q": null}, {"ini": 433.69, "fin": 435.35, "txt": "dos mil veintiséis.", "q": null}, {"ini": 435.15, "fin": 437.11, "txt": "Etiqueta:", "q": null}, {"ini": 436.91, "fin": 438.11, "txt": "<b>archivado</b>.", "q": null}, {"ini": 437.91, "fin": 439.59, "txt": "Sexto frasco:", "q": null}, {"ini": 439.39, "fin": 441.43, "txt": "en dos mil veinticuatro,", "q": null}, {"ini": 441.23, "fin": 443.83, "txt": "un diputado de <b>Vox</b> en Castilla-La Mancha fue", "q": null}, {"ini": 443.63, "fin": 446.85, "txt": "<b>condenado</b> a seis meses por <b>administración desleal</b>,", "q": null}, {"ini": 446.65, "fin": 449.59, "txt": "por un negocio privado entre dos empresas,", "q": null}, {"ini": 449.39, "fin": 451.83, "txt": "no por <b>dinero público</b>.", "q": null}, {"ini": 451.63, "fin": 452.77, "txt": "Etiqueta:", "q": null}, {"ini": 452.57, "fin": 453.85, "txt": "<b>condenado</b>.", "q": null}, {"ini": 453.65, "fin": 455.11, "txt": "Y el último:", "q": null}, {"ini": 454.91, "fin": 456.76, "txt": "los que se fueron.", "q": null}, {"ini": 456.56, "fin": 459.51, "txt": "Vidal-Quadras, Espinosa de los Monteros,", "q": null}, {"ini": 459.31, "fin": 461.31, "txt": "Macarena Olona.", "q": null}, {"ini": 461.11, "fin": 463.61, "txt": "Casi todos los que levantaron <b>Vox</b> ya no", "q": null}, {"ini": 463.41, "fin": 466.35, "txt": "están, y varios salieron diciendo que el partido", "q": null}, {"ini": 466.15, "fin": 469.13, "txt": "<b>no explicaba bien sus cuentas</b>.", "q": null}, {"ini": 468.93, "fin": 470.15, "txt": "Etiqueta:", "q": null}, {"ini": 469.95, "fin": 472.05, "txt": "<b>sin causa</b>.", "q": null}, {"ini": 471.85, "fin": 473.47, "txt": "Lección del Decano:", "q": null}, {"ini": 473.27, "fin": 475.45, "txt": "que no haya condenas al partido es un", "q": null}, {"ini": 475.25, "fin": 476.68, "txt": "dato a favor.", "q": null}, {"ini": 476.48, "fin": 479.25, "txt": "Pero el estudio del episodio anterior ya lo", "q": null}, {"ini": 479.05, "fin": 480.39, "txt": "decía:", "q": null}, {"ini": 480.19, "fin": 482.57, "txt": "la corrupción crece con el tiempo y con", "q": null}, {"ini": 482.37, "fin": 484.31, "txt": "el poder.", "q": null}, {"ini": 484.11, "fin": 485.55, "txt": "<b>Vox</b> lleva poco tiempo,", "q": null}, {"ini": 485.35, "fin": 488.15, "txt": "y ha tenido <b>poco poder</b>.", "q": null}, {"ini": 487.95, "fin": 489.9, "txt": "¿Cómo sabremos qué haría con mucho?", "q": null}, {"ini": 490.7, "fin": 492.96, "txt": "Para el veintinueve de noviembre,", "q": null}, {"ini": 492.76, "fin": 495.38, "txt": "<b>Vox</b> pone la <b>inmigración</b> en el centro:", "q": null}, {"ini": 495.18, "fin": 497.56, "txt": "<b>prioridad nacional</b> en ayudas y vivienda,", "q": null}, {"ini": 497.36, "fin": 500.21, "txt": "más <b>expulsiones</b>, y <b>menos impuestos</b>.", "q": null}, {"ini": 500.01, "fin": 501.92, "txt": "<b>Acascar</b> lo tiene claro.", "q": null}, {"ini": 502.22, "fin": 504.24, "txt": "Yo prometo mano dura.", "q": "acascar"}, {"ini": 504.04, "fin": 506.68, "txt": "Lo de cómo se paga,", "q": "acascar"}, {"ini": 506.48, "fin": 508.38, "txt": "ya si eso, después.", "q": "acascar"}, {"ini": 508.68, "fin": 511.52, "txt": "Pregunta del Decano, la misma de siempre:", "q": null}, {"ini": 511.32, "fin": 513.36, "txt": "¿<b>cuánto cuesta</b>, <b>quién lo paga</b>,", "q": null}, {"ini": 513.16, "fin": 515.48, "txt": "y quién hará los trabajos que hoy hacen", "q": null}, {"ini": 515.28, "fin": 516.27, "txt": "los que se van?", "q": null}, {"ini": 517.07, "fin": 520.23, "txt": "Balance, como en clase.", "q": null}, {"ini": 520.03, "fin": 521.75, "txt": "En un plato:", "q": null}, {"ini": 521.55, "fin": 523.97, "txt": "un hombre que creció bajo la amenaza de", "q": null}, {"ini": 523.77, "fin": 526.99, "txt": "<b>ETA</b>, un partido que nadie daba por vivo", "q": null}, {"ini": 526.79, "fin": 529.51, "txt": "y que hoy escucha a millones,", "q": null}, {"ini": 529.31, "fin": 533.17, "txt": "y ninguna condena al partido por corrupción.", "q": null}, {"ini": 532.97, "fin": 534.47, "txt": "En el otro:", "q": null}, {"ini": 534.27, "fin": 536.53, "txt": "un sueldo público más alto que el del", "q": null}, {"ini": 536.33, "fin": 540.35, "txt": "presidente, una campaña pagada desde el extranjero,", "q": null}, {"ini": 540.15, "fin": 541.67, "txt": "un banco de <b>Orbán</b>,", "q": null}, {"ini": 541.47, "fin": 543.75, "txt": "una fundación propia que recibe millones,", "q": null}, {"ini": 543.55, "fin": 547.07, "txt": "y unos fundadores que se fueron pidiendo cuentas.", "q": null}, {"ini": 546.87, "fin": 548.83, "txt": "Cuál pesa más no te lo vamos a", "q": null}, {"ini": 548.63, "fin": 549.25, "txt": "decir.", "q": null}, {"ini": 549.05, "fin": 550.58, "txt": "Eso <b>lo decides tú</b>.", "q": null}, {"ini": 550.38, "fin": 553.13, "txt": "Hume escribió que el sabio ajusta lo que", "q": null}, {"ini": 552.93, "fin": 554.79, "txt": "cree <b>a las pruebas</b>.", "q": null}, {"ini": 554.59, "fin": 555.73, "txt": "No a los colores,", "q": null}, {"ini": 555.53, "fin": 557.07, "txt": "ni a los gritos:", "q": null}, {"ini": 556.87, "fin": 559.03, "txt": "<b>a las pruebas</b>.", "q": null}, {"ini": 558.83, "fin": 561.33, "txt": "Las tres preguntas de siempre:", "q": null}, {"ini": 561.13, "fin": 564.83, "txt": "¿qué prometieron, y qué cumplieron <b>donde ya mandan</b>?", "q": null}, {"ini": 564.63, "fin": 567.35, "txt": "¿Son euros o porcentajes?", "q": null}, {"ini": 567.15, "fin": 568.75, "txt": "¿Me fío de la gente de la que", "q": null}, {"ini": 568.55, "fin": 570.29, "txt": "se rodean?", "q": null}, {"ini": 570.09, "fin": 572.61, "txt": "Aquí no te decimos a quién votar.", "q": null}, {"ini": 572.41, "fin": 573.63, "txt": "Te decimos que votes,", "q": null}, {"ini": 573.43, "fin": 576.17, "txt": "y que <b>votes pensando</b>.", "q": null}, {"ini": 575.97, "fin": 579.17, "txt": "En el próximo episodio de Españistán:", "q": null}, {"ini": 578.97, "fin": 580.95, "txt": "<b>el bipartidismo</b>.", "q": null}, {"ini": 580.75, "fin": 582.53, "txt": "Por qué no eliges a las personas,", "q": null}, {"ini": 582.33, "fin": 584.49, "txt": "sino <b>listas cerradas</b>.", "q": null}, {"ini": 584.29, "fin": 586.63, "txt": "Y por qué eso hace que quienes mandan", "q": null}, {"ini": 586.43, "fin": 588.71, "txt": "dependan más de su partido que de tu", "q": null}, {"ini": 588.51, "fin": 589.03, "txt": "voto.", "q": null}, {"ini": 589.83, "fin": 591.63, "txt": "Y no te olvides:", "q": null}, {"ini": 591.43, "fin": 593.45, "txt": "<b>dale a like</b>, <b>suscríbete</b>,", "q": null}, {"ini": 593.25, "fin": 595.69, "txt": "y activa <b>la campana</b> para que te avisemos", "q": null}, {"ini": 595.49, "fin": 597.03, "txt": "del próximo episodio.", "q": null}], "PLANOS": [{"en": 0, "tipo": "cueva", "cam": [640, 300, 1.15], "cam2": [450, 210, 1.9], "musica": "misterio", "ini": 0, "fin": 8.05}, {"en": "1:Montaigne", "tipo": "decano", "cam": [870, 245, 2.6], "cam2": [860, 250, 2.2], "musica": "misterio", "capas": [{"tipo": "cita", "autor": "MONTAIGNE · 1580", "texto": "Nada se cree con tanta fuerza como lo que menos se conoce.", "en": "1:Montaigne", "hasta": "1:Así que hoy", "ini": 8.3, "fin": 13.22}], "ini": 8.05, "fin": 15.39}, {"en": "1:Este es Acascar", "tipo": "teatro", "escena": "caballo", "cam": [500, 300, 1.9], "cam2": [640, 360, 1.05], "musica": "neutro", "particulas": [{"tipo": "pajaros", "n": 8, "zona": [0, 40, 1280, 260], "ini": 15.39, "fin": 28.65}], "capas": [{"tipo": "nota", "texto": "Acascar", "sub": "Líder de Vox, el tercer partido", "dato": "2014: 0 diputados · 2026: ~19 % en las encuestas", "pos": "der", "en": "1:Este es Acascar", "hasta": "1:Mismas reglas", "ini": 15
