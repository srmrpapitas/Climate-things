<!doctype html>
<!-- Anime en 3D (como el CG de One Punch Man 2): personajes con sombreado plano en 2–3 tonos y contorno negro, clips de movimiento
     de la UAL, cámara por código. Prueba del contacto del puñetazo del paralepípedo.
     python3 -m http.server 8765 → http://localhost:8765/fabrica/anime3d/golpe.html?t=0  (window.dibuja(t), window.listo) -->
<meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "../../vendor/three.module.min.js" } }</script>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import { cargaPersonaje } from '../herramientas/personajes.js';

const W = 540, H = 960, q = new URLSearchParams(location.search);
const ren = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
ren.setSize(W, H); ren.setPixelRatio(2);
const esc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(38, W / H, .05, 100);

// fondo: oscuro con un brillo magenta detrás del punto del golpe (en el anime la luz del impacto manda)
const lienzo = document.createElement('canvas'); lienzo.width = 512; lienzo.height = 1024;
{ const g = lienzo.getContext('2d'), r = g.createRadialGradient(256, 380, 10, 256, 380, 700);
  r.addColorStop(0, '#ffd6f4'); r.addColorStop(.12, '#d0409a'); r.addColorStop(.45, '#3a1640'); r.addColorStop(1, '#0c0812'); g.fillStyle = r; g.fillRect(0, 0, 512, 1024); }
esc.background = new THREE.CanvasTexture(lienzo); esc.background.colorSpace = THREE.SRGBColorSpace;

// luces de anime: una clave dura, una de contra magenta (el brillo del golpe) y un poco de ambiente
esc.add(new THREE.AmbientLight(0xffffff, .55));
const clave = new THREE.DirectionalLight(0xfff2e0, 2.4); clave.position.set(-2, 4, 3); esc.add(clave);
const contra = new THREE.DirectionalLight(0xff5fc8, 3.2); contra.position.set(1, 2, 6); esc.add(contra);

// sombreado de anime: 3 tonos sin degradado + contorno negro (casco invertido: la malla un pelo más gorda, por dentro, en negro)
const tonos = new THREE.DataTexture(new Uint8Array([70, 70, 70, 255, 160, 160, 160, 255, 255, 255, 255, 255]), 3, 1);
tonos.minFilter = tonos.magFilter = THREE.NearestFilter; tonos.needsUpdate = true;
function anime(obj, grosor = .011) {
  const mallas = []; obj.traverse(o => { if (o.isMesh) mallas.push(o); });
  for (const o of mallas) {
    const m = o.material; o.material = new THREE.MeshToonMaterial({ map: m.map, color: m.color, gradientMap: tonos });
    const linea = new THREE.MeshBasicMaterial({ color: 0x120c16, side: THREE.BackSide });
    const s = o.getWorldScale(new THREE.Vector3()).x;
    linea.onBeforeCompile = sh => { sh.vertexShader = sh.vertexShader.replace('#include <skinning_vertex>',
      `#include <skinning_vertex>\n transformed += normalize(objectNormal) * ${(grosor / s).toFixed(5)};`); };
    const borde = o.isSkinnedMesh ? new THREE.SkinnedMesh(o.geometry, linea) : new THREE.Mesh(o.geometry, linea);
    if (o.isSkinnedMesh) borde.bind(o.skeleton, o.bindMatrix);
    borde.frustumCulled = false; o.parent.add(borde); borde.position.copy(o.position); borde.quaternion.copy(o.quaternion); borde.scale.copy(o.scale);
  }
}

const padre = await cargaPersonaje(q.get('padre') || 'Character_Male_37'), nino = await cargaPersonaje(q.get('nino') || 'Character_Male_33');
esc.add(padre.obj, nino.obj); esc.updateMatrixWorld(true); anime(padre.obj); anime(nino.obj, .008);
const hueso = (p, n) => { let b; p.obj.traverse(o => { if (o.name === n) b = o; }); return b; };
nino.obj.scale.multiplyScalar(.72); hueso(nino, 'mixamorigHead').scale.setScalar(1.3);   // proporciones de niño: más bajo y cabeza grande
const puno = padre.accion('Punch_Cross', { bucle: false }), mano = hueso(padre, 'mixamorigRightHand'), cabeza = hueso(nino, 'mixamorigHead');
nino.accion('Idle_Loop');

// el instante del contacto: cuando la mano derecha llega más lejos hacia delante
const v = new THREE.Vector3(); let T = 0, lejos = -1e9;
for (let t = 0; t < puno.getClip().duration; t += 1 / 60) { padre.mixer.setTime(t); padre.obj.updateMatrixWorld(true); mano.getWorldPosition(v); if (v.z > lejos) { lejos = v.z; T = t; } }
padre.mixer.setTime(T); padre.obj.updateMatrixWorld(true); const golpe = mano.getWorldPosition(new THREE.Vector3());
nino.mixer.setTime(0); nino.obj.updateMatrixWorld(true); const cara = cabeza.getWorldPosition(new THREE.Vector3());
// el niño mira al padre con la mejilla en el puño; el padre baja hasta su altura (el plano corta por la cintura: trampa de anime)
nino.obj.rotation.y = Math.PI; nino.obj.position.set(golpe.x + .07, 0, golpe.z + .1); padre.obj.position.y = cara.y + .02 - golpe.y;

window.dibuja = t => {
  padre.mixer.setTime(Math.min(T, t)); nino.mixer.setTime(t);
  esc.updateMatrixWorld(true); const g = mano.getWorldPosition(new THREE.Vector3());
  if (q.get('vista') === 'lejos') { cam.position.set(g.x + 3.5, g.y + .8, g.z); cam.lookAt(g.x, g.y - .6, g.z); }   // depurar: de lado
  else { cam.position.set(g.x + .55, g.y + .32, g.z - 1.25); cam.lookAt(g.x - .05, g.y, g.z + .2); }   // por encima del hombro derecho del padre
  ren.render(esc, cam);
};
window.dibuja(+q.get('t') || 0); window.T = T; window.listo = true;
</script>
